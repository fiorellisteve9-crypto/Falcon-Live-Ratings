<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Falcón Admin</title>
<link rel="manifest" href="/manifest-admin.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Falcón Admin">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#121212;--bg2:#1e1e1e;--bg3:#2a2a2a;
  --text:#e8e8e8;--text2:#b3b3b3;--text3:#9a9a9a;
  --green:#8BC34A;--red:#f44336;--gold:#ffd54f;--blue:#42a5f5;
  --border:#333;--radius:10px;
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased}
header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.header-inner{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:17px;font-weight:700;color:var(--green)}
.brand small{display:block;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.4px}
.user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
nav.tabs{max-width:760px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;
  border-bottom:1px solid var(--border);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:none;color:var(--text3);padding:11px 12px;font-size:12px;
  font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.tab.active{color:var(--text);border-bottom-color:var(--green)}
main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:2px}
.card h3{font-size:14px;margin-bottom:8px;color:var(--text)}
.muted{color:var(--text2);font-size:12px}
.small{font-size:11px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600;letter-spacing:.2px}
.input,select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:10px 11px;font-size:16px;font-family:inherit;outline:none}
.input:focus,select:focus{border-color:var(--green)}
.input:focus-visible,select:focus-visible,.btn:focus-visible,.tab:focus-visible,.res:focus-visible,.link:focus-visible{
  outline:2px solid var(--green);outline-offset:2px}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 13px;
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:var(--green);color:#000}
.btn-danger{background:rgba(244,67,54,.15);border-color:rgba(244,67,54,.5);color:#ff8a80}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:11px;border-radius:6px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;
  background:rgba(139,195,74,.15);color:var(--green);vertical-align:1px}
.pill.red{background:rgba(244,67,54,.15);color:#ff8a80}
.pill.gray{background:rgba(255,255,255,.08);color:var(--text2)}
.table-wrap{overflow-x:auto;margin:0 -4px}
table.stack-mobile{min-width:560px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
th,td{padding:7px 5px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
td.num,th.num{text-align:right}
tr.withdrawn td{opacity:.5;text-decoration:line-through}
.v-up{color:var(--green)}.v-down{color:var(--red)}
.round{margin-top:14px}
.round-title{font-size:12px;font-weight:700;color:var(--gold);margin:10px 0 4px;letter-spacing:.3px}
.game{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.game:last-child{border-bottom:none}
.game-names{flex:1;min-width:180px;font-size:13px}
.game-names .bye{color:var(--text3)}
.res{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:8px;
  padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;min-width:48px;min-height:40px}
.res.on{background:var(--green);border-color:var(--green);color:#000}
.res:disabled{opacity:.5;cursor:not-allowed}
.player-pick{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border)}
.player-pick:last-child{border-bottom:none}
.player-pick input{width:18px;height:18px;accent-color:var(--green)}
.player-pick .nm{flex:1;font-size:13px}
.player-pick .rt{font-size:11px;color:var(--text3)}
.hidden{display:none!important}
.empty{text-align:center;padding:28px 10px;color:var(--text2);font-size:13px}
.auth{max-width:420px;margin:28px auto}
.auth h2{margin-bottom:4px}
.auth .btn{width:100%;margin-top:6px}
.auth-back{display:block;text-align:center;text-decoration:none}
.link{background:none;border:none;color:var(--green);font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.msg{font-size:12px;color:#ff8a80;margin-top:8px;min-height:16px}
.msg.ok{color:var(--green)}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*{display:none!important}
  #printArea{display:block!important;padding:0;color:#000;font-size:12px}
  #printArea h1{font-size:18px;margin-bottom:2px}
  #printArea .pmeta{color:#444;margin-bottom:10px}
  #printArea table{width:100%;min-width:0;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:4px 5px;text-align:left;white-space:nowrap;color:#000}
  #printArea th{background:#eee;font-size:10px}
  #printArea td.num,#printArea th.num{text-align:right}
  #printArea h2{font-size:13px;margin:14px 0 4px}
}
#modalWrap{position:fixed;inset:0;z-index:100;display:none}
#modalWrap.show{display:block}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;
  justify-content:center;padding:18px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;
  max-width:420px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.55);max-height:85vh;overflow:auto}
.modal.danger{border-color:rgba(244,67,54,.55)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--text2);line-height:1.55}
.modal-body b{color:var(--text)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{min-width:92px;padding:11px 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 16px;
  border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;
  max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:rgba(244,67,54,.6)}
.toast.good{border-color:rgba(139,195,74,.6)}
.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.bulk{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.hint{font-size:12px;color:var(--gold);margin-top:8px;font-weight:600}
.hint.ok{color:var(--green)}
.game{border-radius:8px}
.game .res.on{box-shadow:0 0 0 1px var(--green) inset}
nav.tabs{position:sticky;top:var(--header-h,58px);z-index:19;background:var(--bg);padding-top:2px}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,#343434 50%,var(--bg3) 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.msg.inline{color:#ff8a80;font-size:12px;margin-top:8px}
.msg.inline.ok{color:var(--green)}
.zona{border-color:rgba(244,67,54,.45)}
.zona h3{color:#ff8a80}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filter-row select{flex:1;min-width:110px;font-size:14px;padding:8px 10px}
.legend{font-size:11px;color:var(--text3);margin-top:8px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (max-width:560px){
  table.stack-mobile{min-width:0}
  table.stack-mobile thead{display:none}
  table.stack-mobile tbody,table.stack-mobile tr,table.stack-mobile td{display:block;width:auto}
  table.stack-mobile tr{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:8px 10px;background:var(--bg3)}
  table.stack-mobile td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    border:none;padding:4px 0;white-space:normal}
  table.stack-mobile td::before{content:attr(data-label);color:var(--text3);font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto;padding-top:2px}
  table.stack-mobile td .cellv{flex:1;min-width:0;text-align:right}
  table.stack-mobile td .cellv>div{margin-top:1px}
  table.stack-mobile td.num{text-align:left}
  table.stack-mobile td:empty{display:none}
  table.stack-mobile td:last-child{padding-top:8px}
  table.stack-mobile td:last-child .cellv{text-align:right}
  table.stack-mobile td:last-child .btn{width:100%;padding:10px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">♟ Falcón Admin<small>Falcón Live Ratings</small></div>
    <div class="user" id="user"></div>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div id="printArea"></div>
<div id="modalWrap"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const API = "/api";
let token = localStorage.getItem("falconAdminToken") || "";
let adminName = localStorage.getItem("falconAdminName") || "Administrador";
let dashboard = null;
let tab = "torneo";
let apiVersion = "?";
let configured = true;
let historyTournament = null;
let editingPlayer = null;
let selectedPlayers = new Set();
let newName = "";
let newRounds = "";
let newType = 1;
let newRhythm = "Blitz";
let matchRhythm = "Blitz";
let matchP1 = "";
let matchP2 = "";
let matchGames = 1;
let matchResults = [null];
let matchDate = todayLocal();
let busy = false;
let matchListLimit = 10;
let matchListRhythm = "Todos";
let lastUpdate = null;
let playerForm = {name:"", mun:"Falcón", cat:"-", foto:"", rhythm:"Blitz", rating:"", rd:"", dirty:false};
let editMatch = null;
let editMatchResults = [];
let editMatchDate = "";
let newQuery = "";
let newCatFilter = "";
let newMunFilter = "";

function beginBusy(btn, label) {
  if (busy) return false;
  busy = true;
  if (btn) { btn.dataset.origHtml = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || "Guardando\u2026"; }
  el("#app").setAttribute("aria-busy", "true");
  return true;
}
function endBusy(btn) {
  busy = false;
  if (btn && btn.dataset && btn.dataset.origHtml !== undefined) {
    btn.innerHTML = btn.dataset.origHtml;
    btn.disabled = false;
    delete btn.dataset.origHtml;
  }
  el("#app").removeAttribute("aria-busy");
}

const RHYTHMS = ["Rapid", "Blitz", "Bullet"];
const CATEGORIES = ["-", "Sub-8", "Sub-10", "Sub-12", "Sub-14", "Sub-16", "Sub-18", "Sub-20", "Absoluta", "Senior", "Súper Senior"];
const TYPE_NAMES = {1: "Suizo", 2: "Round Robin 1V", 3: "Round Robin 2V"};

const el = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const round = (v) => String(Math.round(Number(v) || 0));
const f1 = (v) => (Number(v) || 0).toFixed(1);
const fv = (v) => { const n = Number(v) || 0; return n > 0 ? "+" + n : String(n); };
function todayLocal() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function toast(msg, kind = "") {
  const t = el("#toast");
  t.textContent = msg;
  t.className = "toast show " + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = "toast"; }, 3500);
}

function cleanMessage(err) {
  if (!err) return "Error";
  if (err.status === 401) return "Sesión expirada. Entra de nuevo.";
  const m = String(err.message || "");
  if (/failed to fetch|networkerror|load failed|network request failed/i.test(m))
    return "Sin conexión con el servidor. Revisa tu red y reintenta.";
  return m || "Error";
}

function saveSession(tok, name) {
  token = tok;
  adminName = name || "Administrador";
  localStorage.setItem("falconAdminToken", token);
  localStorage.setItem("falconAdminName", adminName);
}

function clearSession() {
  token = "";
  dashboard = null;
  localStorage.removeItem("falconAdminToken");
  localStorage.removeItem("falconAdminName");
}

async function api(action, extra = {}) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers["x-token"] = token;
  const res = await fetch(API, {
    method: "POST",
    headers,
    body: JSON.stringify(Object.assign({action}, extra))
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && action !== "login" && action !== "setup") {
      clearSession();
      showLogin("Sesión expirada. Entra de nuevo.");
    }
    const err = new Error(data.error || ("Error " + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function loadStatus() {
  try {
    const res = await fetch(API + "?action=status");
    if (!res.ok) throw new Error("status");
    const data = await res.json();
    configured = !!data.configured;
    apiVersion = data.version || "?";
  } catch (e) {
    configured = true;
  }
}

function renderHeader() {
  const user = el("#user");
  const tabs = el("#tabs");
  if (!dashboard) {
    user.innerHTML = "";
    tabs.innerHTML = "";
    return;
  }
  user.innerHTML = `<span>${esc(adminName)}</span>
    ${lastUpdate ? `<span class="small muted" title="Última actualización">Act. ${esc(lastUpdate)}</span>` : ""}
    <button class="btn btn-ghost btn-sm" onclick="reload()" title="Actualizar" aria-label="Actualizar datos">&#8635;</button>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>`;
  const items = [["torneo","Torneo"],["nuevo","Nuevo"],["matches","Matches"],["jugadores","Jugadores"],["historial","Historial"],["ajustes","Ajustes"]];
  tabs.innerHTML = items.map(([k, l]) =>
    `<button class="tab ${tab === k ? "active" : ""}" aria-current="${tab === k ? "page" : "false"}" onclick="setTab('${k}')">${l}</button>`
  ).join("");
}

function setTab(k) {
  tab = k;
  historyTournament = null;
  render(false);
  scrollToTop();
}

function skeletonHtml() {
  return `<div class="card" aria-busy="true">
    <div class="skel" style="height:18px;width:45%"></div>
    <div class="skel" style="height:12px;width:75%;margin-top:10px"></div>
    <div class="skel" style="height:140px;margin-top:14px"></div>
    <div class="skel" style="height:90px;margin-top:10px"></div>
  </div>`;
}

function setHeaderH() {
  const h = document.querySelector("header");
  if (!h) return;
  const px = Math.max(56, Math.round(h.getBoundingClientRect().height));
  document.documentElement.style.setProperty("--header-h", px + "px");
}

window.addEventListener("resize", () => { if (dashboard) setHeaderH(); });

function render(keepScroll = true) {
  const y = window.scrollY;
  renderHeader();
  if (!dashboard) { el("#app").innerHTML = skeletonHtml(); setHeaderH(); return; }
  let html = "";
  if (tab === "torneo") html = renderTorneo();
  else if (tab === "nuevo") html = renderNuevo();
  else if (tab === "matches") html = renderMatches();
  else if (tab === "jugadores") html = renderJugadores();
  else if (tab === "historial") html = renderHistorial();
  else if (tab === "ajustes") html = renderAjustes();
  el("#app").innerHTML = html;
  if (tab === "nuevo" && newQuery) filterPlayers(newQuery);
  saveDraft();
  setHeaderH();
  if (keepScroll) window.scrollTo(0, y);
}

async function loadDashboard() {
  dashboard = await api("dashboard");
  lastUpdate = new Date().toTimeString().slice(0, 5);
  render(false);
}

/* ── Borrador persistente (pestaña y match en curso) ────────────── */

function saveDraft() {
  try {
    sessionStorage.setItem("falconDraft", JSON.stringify({
      tab, matchRhythm, matchP1, matchP2, matchGames, matchResults, matchDate,
      newName, newRounds, newType
    }));
  } catch (e) {}
}

function loadDraft() {
  try { return JSON.parse(sessionStorage.getItem("falconDraft") || "{}") || {}; }
  catch (e) { return {}; }
}

function applyDraft() {
  const d = loadDraft();
  if (!d || !Object.keys(d).length) return;
  if (d.tab) tab = d.tab === "importar" ? "ajustes" : d.tab;
  if (d.matchRhythm) matchRhythm = d.matchRhythm;
  if (d.matchP1 !== undefined) matchP1 = d.matchP1;
  if (d.matchP2 !== undefined) matchP2 = d.matchP2;
  if (d.matchDate) matchDate = d.matchDate;
  if (d.matchGames) matchGames = d.matchGames;
  if (Array.isArray(d.matchResults)) matchResults = d.matchResults;
  if (d.newName !== undefined) newName = d.newName;
  if (d.newRounds !== undefined) newRounds = d.newRounds;
  if (d.newType) newType = d.newType;
}

/* ── Modal propio ───────────────────────────────────────────────── */

function reduceMotion() {
  return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}

function scrollToTop() {
  window.scrollTo({top: 0, behavior: reduceMotion() ? "auto" : "smooth"});
}

function uiModal(opts) {
  const o = Object.assign({
    title: "", body: "", okText: "Aceptar", okClass: "btn-primary",
    cancelText: "Cancelar", input: null, danger: false
  }, opts || {});
  return new Promise((resolve) => {
    const wrap = el("#modalWrap");
    const done = (v) => {
      wrap.innerHTML = "";
      wrap.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      resolve(v);
    };
    const onKey = (e) => { if (e.key === "Escape") done(false); };
    wrap.innerHTML = `
      <div class="modal-back" id="modalBack">
        <div class="modal ${o.danger ? "danger" : ""}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <h3 id="modalTitle">${esc(o.title)}</h3>
          ${o.body ? `<div class="modal-body">${o.body}</div>` : ""}
          ${o.input ? `<input class="input" id="modalInput" placeholder="${esc(o.input.placeholder || "")}" autocomplete="off">` : ""}
          <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel">${esc(o.cancelText)}</button>
            <button class="btn ${o.okClass}" id="modalOk">${esc(o.okText)}</button>
          </div>
        </div>
      </div>`;
    wrap.classList.add("show");
    const input = el("#modalInput");
    if (input) { input.focus(); input.select(); }
    el("#modalCancel").onclick = () => done(false);
    el("#modalOk").onclick = () => {
      if (o.input && !input.value.trim()) { input.focus(); toast("Escribe el texto para confirmar", "bad"); return; }
      done(o.input ? {ok: true, value: input.value.trim()} : true);
    };
    el("#modalBack").onclick = (ev) => { if (ev.target.id === "modalBack") done(false); };
    document.addEventListener("keydown", onKey);
  });
}

/* ── Autenticación ─────────────────────────────────────────────── */

function authShell(inner) {
  el("#user").innerHTML = "";
  el("#tabs").innerHTML = "";
  el("#app").innerHTML = `<div class="card auth">${inner}
    <a class="btn btn-ghost auth-back" href="/" title="Volver a la web pública">← Volver a Falcón Live Ratings</a>
  </div>`;
}

function showLogin(message = "") {
  authShell(`
    <h2>Entrar</h2>
    <p class="muted" style="margin-bottom:14px">Panel de administración de Falcón Live Ratings.</p>
    <form onsubmit="doLogin(event)">
      <div style="margin-bottom:10px">
        <label>PIN</label>

async function doSetup(ev) {

/* ── Torneo actual ─────────────────────────────────────────────── */

function nextRound(t) {
  const has = (t.games || []).some(g => Number(g.round) === Number(t.round_current));
  return Number(t.round_current) + (has ? 1 : 0);
}

function renderStandings(t, allowWithdraw) {
  const rows = (t.standings || []).map(s => `
    <tr class="${s.withdrawn ? "withdrawn" : ""}">
      <td>${s.pos}</td>
      <td>${esc(s.name)} ${s.withdrawn ? '<span class="pill red">ret</span>' : ""}</td>
      <td class="num"><b>${f1(s.points)}</b></td>
      <td class="num">${f1(s.bh1)}</td>
      <td class="num">${s.rating}</td>
      <td class="num ${s.v > 0 ? "v-up" : (s.v < 0 ? "v-down" : "")}">${fv(s.v)}</td>
      ${allowWithdraw ? `<td class="num"><button class="btn btn-ghost btn-sm" title="Retirar" aria-label="Retirar a ${esc(s.name)} del torneo" onclick="withdrawPlayer(${s.player_id},event)">×</button></td>` : ""}
    </tr>`).join("");
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>#</th><th>Jugador</th><th class="num">Pts</th><th class="num" title="Buchholz Cut 1">BH1</th>
      <th class="num">Rtg</th><th class="num" title="Variación de rating en el torneo">V</th>${allowWithdraw ? "<th></th>" : ""}
    </tr></thead>
    <tbody>${rows}</tbody></table></div>
    <details class="detail small muted"><summary>Desempates completos</summary>
      <div class="table-wrap" style="margin-top:8px"><table><thead><tr>
        <th>#</th><th>Jugador</th><th class="num">DE</th><th class="num">BH</th><th class="num">SB</th>
        <th class="num">W</th><th class="num">Koya</th><th class="num">AROC1</th><th class="num">TPR</th>
      </tr></thead><tbody>${(t.standings || []).map(s => `<tr>
        <td>${s.pos}</td><td>${esc(s.name)}</td><td class="num">${f1(s.de)}</td><td class="num">${f1(s.bh)}</td>
        <td class="num">${f1(s.sb)}</td><td class="num">${s.wins}</td><td class="num">${f1(s.koya)}</td>
        <td class="num">${round(s.aroc1)}</td><td class="num">${s.tpr}</td></tr>`).join("")}
      </tbody></table></div>
    </details>`;
}

function renderGames(t, readonly) {
  if (!t.games || !t.games.length) {
    return `<div class="empty">Aún no hay emparejamientos.</div>`;
  }
  const byRound = {};
  t.games.forEach(g => {
    const r = Number(g.round);
    (byRound[r] = byRound[r] || []).push(g);
  });
  return Object.keys(byRound).sort((a, b) => a - b).map(r => {
    const games = byRound[r].sort((a, b) => a.id - b.id).map(g => {
      if (g.bye) {
        return `<div class="game"><div class="game-names">${esc(g.white)} <span class="bye">— BYE (+1)</span></div></div>`;
      }
      const names = `<div class="game-names">${esc(g.white)} <span class="muted">vs</span> ${esc(g.black)}</div>`;
      if (readonly) {
        const res = g.result === 1 ? "1-0" : (g.result === 0 ? "0-1" : (g.result === 0.5 ? "½" : "—"));
        return `<div class="game">${names}<span class="muted">${res}</span></div>`;
      }
      return `<div class="game">${names}<div class="row">
        <button class="res ${g.result === 1 ? "on" : ""}" aria-label="Partida ${esc(g.white)} con blancas contra ${esc(g.black)}: ganan las blancas" onclick="saveResult(${g.id},1,event)">1-0</button>
        <button class="res ${g.result === 0.5 ? "on" : ""}" aria-label="Partida ${esc(g.white)} contra ${esc(g.black)}: empate" onclick="saveResult(${g.id},0.5,event)">½</button>
        <button class="res ${g.result === 0 ? "on" : ""}" aria-label="Partida ${esc(g.white)} con blancas contra ${esc(g.black)}: ganan las negras" onclick="saveResult(${g.id},0,event)">0-1</button>
      </div></div>`;
    }).join("");
    return `<div class="round"><div class="round-title">Ronda ${r}</div>${games}</div>`;
  }).join("");
}

function renderTournamentDetail(t, readonly) {
  if (!t) return "";
  const status = t.finished ? '<span class="pill gray">Finalizado</span>' : '<span class="pill">En curso</span>';
  const nr = nextRound(t);
  const canPair = !t.finished && nr <= Number(t.rounds_total);
  return `
    <div class="card">
      <div class="row between">
        <div><h2>${esc(t.name)}</h2>
          <div class="muted">${esc(t.rhythm)} · ${esc(TYPE_NAMES[t.type] || "Torneo")} · Ronda ${t.round_current}/${t.rounds_total}</div>
        </div>${status}
      </div>
      ${!t.finished ? `<div class="row" style="margin-top:12px">
        ${canPair ? `<button class="btn btn-primary" onclick="pairRound(event)" ${t.pending > 0 ? "disabled" : ""}>Emparejar ronda ${nr}</button>` : ""}
        <button class="btn btn-danger" onclick="closeTournament(event)" ${t.pending > 0 ? "disabled" : ""}>Cerrar torneo</button>
        <button class="btn btn-ghost" onclick="setTab('nuevo')">Nuevo torneo</button>
        <button class="btn btn-ghost" onclick="printTournamentById(${t.id})">Imprimir</button>
        <button class="btn btn-ghost" onclick="reload()">Actualizar</button>
      </div>` : `<div class="row" style="margin-top:12px">
        <button class="btn btn-ghost" onclick="printTournamentById(${t.id})">Imprimir</button>
        <button class="btn btn-ghost" onclick="reload()">Actualizar</button></div>`}
      ${t.pending > 0 ? `<div class="msg" style="color:var(--gold)">Faltan ${t.pending} resultados por guardar.</div>` : ""}
    </div>
    <div class="card"><h3>Clasificación</h3>${renderStandings(t, !readonly && !t.finished)}</div>
    <div class="card"><h3>Partidas</h3>${renderGames(t, readonly || t.finished)}</div>
  `;
}

async function pairRound(ev) {
  if (!dashboard.current) return;
  const t = dashboard.current;
  const ok = await uiModal({
    title: "Emparejar ronda",

      toast(`Faltan ${e.data.pending.length} resultados en la ronda actual.`, "bad");

      toast(cleanMessage(e), "bad");
    }

async function closeTournament(ev) {

function setNewType(v) {

  render();
}
function setNewRhythm(v) {
  newRhythm = v;
  render();
}
function togglePlayer(id, checked) {
  if (checked) selectedPlayers.add(Number(id));
  else selectedPlayers.delete(Number(id));
  const c = document.getElementById("selCount");
  if (c) c.textContent = `Jugadores (${selectedPlayers.size} seleccionados)`;
}
function filterPlayers(q) {
  newQuery = String(q || "");
  q = newQuery.toLowerCase();
  document.querySelectorAll("#playerPicks .player-pick").forEach(row => {
    const name = (row.getAttribute("data-name") || "").toLowerCase();
    row.classList.toggle("hidden", q && !name.includes(q));
  });
}

function setNewFilter(kind, v) {
  if (kind === "cat") newCatFilter = v; else newMunFilter = v;
  render();
}

function setAllPlayers(checked) {
  document.querySelectorAll("#playerPicks .player-pick:not(.hidden) input[type=checkbox]").forEach(cb => {
    cb.checked = checked;
    togglePlayer(Number(cb.value), checked);
  });
  render();
}

function autoRounds(n, type) {
  if (n < 2) return 0;
  if (type === 1) return Math.max(1, Math.ceil(Math.log2(Math.max(2, n))));
  if (type === 2) return n % 2 === 0 ? n - 1 : n;
  return n % 2 === 0 ? (n - 1) * 2 : n * 2;
}

function setInlineMsg(id, text, ok) {
  const n = el(id);
  if (!n) return;
  n.textContent = text || "";
  n.className = "msg inline" + (ok ? " ok" : "");
}

function renderNuevo() {

  if (players.length < 2) {
    return `<div class="card"><div class="empty">Necesitas al menos 2 jugadores.<br><br>

  const muns = Array.from(new Set(players.map(p => p.mun || "-"))).sort();

          <div style="flex:1;min-width:120px"><label>Ritmo</label>
            <select onchange="setNewRhythm(this.value)">
              <option value="Rapid" ${newRhythm === "Rapid" ? "selected" : ""}>Rapid</option>
              <option value="Blitz" ${newRhythm === "Blitz" ? "selected" : ""}>Blitz</option>
              <option value="Bullet" ${newRhythm === "Bullet" ? "selected" : ""}>Bullet</option>
            </select>
          </div>
        </div>
        ${!rr ? `<div><label>Rondas (vacío = automático)</label>
          <input class="input" type="number" min="1" max="99" id="tRounds" value="${esc(newRounds)}" oninput="newRounds=this.value" placeholder="Automático"></div>` : ""}
        <div>

              <button class="btn btn-sm" onclick="setAllPlayers(true)">Todos</button>
              <button class="btn btn-sm btn-ghost" onclick="setAllPlayers(false)">Ninguno</button>
            </span>
          </div>
          <input class="input" placeholder="Buscar jugador..." aria-label="Buscar jugador para el torneo" value="${esc(newQuery)}" oninput="filterPlayers(this.value)" style="margin-bottom:8px">
          <div class="filter-row">
            <select aria-label="Filtrar por categoría" onchange="setNewFilter('cat', this.value)">
              <option value="">Todas las categorías</option>

      </div>
    </div>`;

/* ── Matches 1v1 ───────────────────────────────────────────────── */

function setMatchRhythm(v) { matchRhythm = v; render(); }
function setMatchPlayer(n, v) {
  if (n === 1) matchP1 = v; else matchP2 = v;
  render();
}
function setMatchGames(v) {
  matchGames = Math.max(1, Math.min(999, Number(v) || 1));
  const next = [];
  for (let i = 0; i < matchGames; i++) next.push(i < matchResults.length ? matchResults[i] : null);
  matchResults = next;
  render();
}
function setMatchResult(i, v) { matchResults[i] = v; render(); }
function bulkMatchResult(mode) {
  for (let i = 0; i < matchGames; i++) {
    const whiteIsP1 = i % 2 === 0;
    if (mode === "p1") matchResults[i] = whiteIsP1 ? 1 : 0;
    else if (mode === "p2") matchResults[i] = whiteIsP1 ? 0 : 1;
    else if (mode === "draw") matchResults[i] = 0.5;
    else matchResults[i] = null;
  }
  render();
}

function matchScore() {
  let s1 = 0, s2 = 0;
  for (let i = 0; i < matchGames; i++) {
    const r = matchResults[i];
    if (r === null || r === undefined) continue;
    if (i % 2 === 0) { s1 += r; s2 += 1 - r; }
    else { s2 += r; s1 += 1 - r; }
  }
  return {s1, s2};
}

function renderMatches() {
  const players = (dashboard.players || []).slice().sort((a, b) => {
    const ra = ((a.ratings || {})[matchRhythm] || {}).rating || 1500;
    const rb = ((b.ratings || {})[matchRhythm] || {}).rating || 1500;
    return rb - ra;
  });
  if (players.length < 2) {
    return `<div class="card"><div class="empty">Necesitas al menos 2 jugadores.<br><br>
      <button class="btn btn-primary" onclick="setTab('jugadores')">Agregar jugadores</button></div></div>`;
  }
  const slot = (p) => ((p.ratings || {})[matchRhythm] || {}).rating || 1500;
  const opts = (selected) => `<option value="">Elegir jugador</option>` + players.map(p =>
    `<option value="${p.id}" ${String(selected) === String(p.id) ? "selected" : ""}>${esc(p.name)} (${round(slot(p))})</option>`
  ).join("");
  const p1 = players.find(p => String(p.id) === String(matchP1));
  const p2 = players.find(p => String(p.id) === String(matchP2));
  const name1 = p1 ? p1.name : "P1";
  const name2 = p2 ? p2.name : "P2";

  const games = Array.from({length: matchGames}, (_, i) => {
    const whiteIsP1 = i % 2 === 0;
    const p1wins = whiteIsP1 ? 1 : 0;
    const p2wins = whiteIsP1 ? 0 : 1;
    const wn = p1 ? esc(p1.name) : "—";
    const bn = p2 ? esc(p2.name) : "—";
    const whiteName = whiteIsP1 ? wn : bn;
    const blackName = whiteIsP1 ? bn : wn;
    const r = matchResults[i];
    const labelP1 = p1 ? p1.name : "P1";
    const labelP2 = p2 ? p2.name : "P2";
    return `<div class="game">
      <div class="game-names">
        <div><span class="muted">P${i + 1}</span> <b>${wn}</b> <span class="muted">vs</span> <b>${bn}</b></div>
        <div class="small muted">Blancas: ${whiteName} · Negras: ${blackName}</div>
      </div>
      <div class="row">
        <button class="res ${r === p1wins ? "on" : ""}" aria-label="Partida ${i + 1}: gana ${esc(labelP1)}" onclick="setMatchResult(${i},${p1wins})">Gana P1</button>
        <button class="res ${r === 0.5 ? "on" : ""}" aria-label="Partida ${i + 1}: empate" onclick="setMatchResult(${i},0.5)">½</button>
        <button class="res ${r === p2wins ? "on" : ""}" aria-label="Partida ${i + 1}: gana ${esc(labelP2)}" onclick="setMatchResult(${i},${p2wins})">Gana P2</button>
      </div>
    </div>`;
  }).join("");

  const sc = matchScore();
  const faltan = matchResults.filter(r => r === null || r === undefined).length;
  const mismos = !!(matchP1 && matchP2 && String(matchP1) === String(matchP2));
  let hint = "", hintOk = false;
  if (!matchP1 || !matchP2) hint = "Elige el jugador 1 y el jugador 2.";
  else if (mismos) hint = "Los dos jugadores deben ser distintos.";
  else if (faltan) hint = `Faltan ${faltan} resultado${faltan === 1 ? "" : "s"} por marcar.`;
  else { hint = "Todo listo. Puedes registrar el match."; hintOk = true; }
  const allMatches = dashboard.matches || [];
  const filteredMatches = matchListRhythm === "Todos" ? allMatches : allMatches.filter(m => m.ritmo === matchListRhythm);
  const shownMatches = filteredMatches.slice(0, matchListLimit);
  const recent = shownMatches.map(m => `
    <div class="game">
      <div class="game-names"><b>${esc(m.p1)}</b> ${f1(m.score1)} - ${f1(m.score2)} <b>${esc(m.p2)}</b>
        <div class="small muted">${esc(m.ritmo)} · ${m.np} partidas · ${m.fecha ? esc(String(m.fecha).slice(0, 10)) : ""}</div>
      </div>
      <div class="row">
        <div class="small"><span class="${m.var1 > 0 ? "v-up" : (m.var1 < 0 ? "v-down" : "")}">${fv(m.var1)}</span>
          / <span class="${m.var2 > 0 ? "v-up" : (m.var2 < 0 ? "v-down" : "")}">${fv(m.var2)}</span></div>
        <button class="btn btn-sm" onclick="openMatchEditor(${m.id})">Editar</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMatch(${m.id})">Eliminar</button>
      </div>
    </div>`).join("") || `<div class="empty">Sin matches todavía.</div>`;
  const masMatches = filteredMatches.length > matchListLimit
    ? `<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="matchListLimit += 10; render()">Ver más (${filteredMatches.length - matchListLimit} restantes)</button>`
    : "";

  return `
    <div class="card">
      <h2>Match 1v1</h2>
      <p class="muted" style="margin:6px 0 12px">Los colores alternan: partida 1 P1 blancas, partida 2 P2 blancas, etc.</p>
      <div class="stack">
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:130px"><label>Ritmo</label>
            <select onchange="setMatchRhythm(this.value)">
              <option value="Rapid" ${matchRhythm === "Rapid" ? "selected" : ""}>Rapid</option>
              <option value="Blitz" ${matchRhythm === "Blitz" ? "selected" : ""}>Blitz</option>
              <option value="Bullet" ${matchRhythm === "Bullet" ? "selected" : ""}>Bullet</option>
            </select>
          </div>
          <div style="flex:1;min-width:110px"><label>Partidas</label>
            <input class="input" type="number" min="1" max="999" value="${matchGames}" onchange="setMatchGames(this.value)">
          </div>
        </div>
        <div><label>Fecha del match</label>
          <input class="input" type="date" value="${esc(matchDate)}" max="${todayLocal()}" onchange="matchDate=this.value">
          <div class="small muted" style="margin-top:4px">Puedes poner una fecha pasada (ej. 2026-08-09).</div>
        </div>
        <div><label>Jugador 1</label><select onchange="setMatchPlayer(1,this.value)">${opts(matchP1)}</select></div>
        <div><label>Jugador 2</label><select onchange="setMatchPlayer(2,this.value)">${opts(matchP2)}</select></div>
        <div class="card" style="margin:0;background:var(--bg)">
          <div class="row between"><b>Partidas</b><span class="muted">${esc(name1)} ${f1(sc.s1)} - ${f1(sc.s2)} ${esc(name2)}</span></div>
          <div class="bulk" style="margin-top:10px">
            <button class="btn btn-sm" onclick="bulkMatchResult('p1')">Gana P1 todas</button>
            <button class="btn btn-sm" onclick="bulkMatchResult('draw')">Todas ½</button>
            <button class="btn btn-sm" onclick="bulkMatchResult('p2')">Gana P2 todas</button>
            <button class="btn btn-sm btn-ghost" onclick="bulkMatchResult('clear')">Limpiar</button>
          </div>
          ${games}
        </div>
        <div class="hint ${hintOk ? "ok" : ""}">${esc(hint)}</div>
        <button class="btn btn-primary" onclick="createMatch(event)">Registrar match</button>
      </div>
    </div>
    <div class="card">
      <div class="row between">
        <h3>Últimos matches (${filteredMatches.length})</h3>
        <select aria-label="Filtrar matches por ritmo" onchange="matchListRhythm=this.value; matchListLimit=10; render()" style="width:auto;font-size:14px;padding:7px 9px">
          ${["Todos","Rapid","Blitz","Bullet"].map(r => `<option ${matchListRhythm === r ? "selected" : ""}>${r}</option>`).join("")}
        </select>
      </div>
      ${recent}
      ${masMatches}
    </div>`;
}

async function createMatch(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Registrando\u2026")) return;
  try {
  if (!matchP1 || !matchP2) { toast("Elige el jugador 1 y el jugador 2", "bad"); return; }
  if (String(matchP1) === String(matchP2)) { toast("Los dos jugadores deben ser distintos", "bad"); return; }
  const faltan = matchResults.filter(r => r === null || r === undefined).length;
  if (faltan) { toast(`Faltan ${faltan} resultado${faltan === 1 ? "" : "s"} por marcar`, "bad"); return; }
    const r = await api("match_create", {
      player1_id: Number(matchP1),
      player2_id: Number(matchP2),
      rhythm: matchRhythm,
      results: matchResults.map(Number),
      date: matchDate
    });
    dashboard = r.dashboard;
    matchResults = Array.from({length: matchGames}, () => null);
    render();
    toast("Match registrado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

/* ── Editor de match ────────────────────────────────────────────── */

function openMatchEditor(matchId) {
  const m = (dashboard.matches || []).find(x => String(x.id) === String(matchId));
  if (!m) return;
  editMatch = m;
  editMatchResults = (m.resultados || []).map(Number);
  editMatchDate = String(m.fecha || "").slice(0, 10);
  renderMatchEditor();
}

function closeMatchEditor() {
  editMatch = null;
  editMatchResults = [];
  const wrap = el("#modalWrap");
  wrap.innerHTML = "";
  wrap.classList.remove("show");
}

function renderMatchEditor() {
  const m = editMatch;
  const wrap = el("#modalWrap");
  if (!m) { closeMatchEditor(); return; }
  const prev = wrap.querySelector(".modal");
  const prevScroll = prev ? prev.scrollTop : 0;
  const p1 = (dashboard.players || []).find(p => Number(p.id) === Number(m.jugador1_id));
  const p2 = (dashboard.players || []).find(p => Number(p.id) === Number(m.jugador2_id));
  const n1 = p1 ? p1.name : "P1";
  const n2 = p2 ? p2.name : "P2";
  let s1 = 0, s2 = 0;
  const games = editMatchResults.map((r, i) => {
    const whiteIsP1 = i % 2 === 0;
    const p1wins = whiteIsP1 ? 1 : 0;
    const p2wins = whiteIsP1 ? 0 : 1;
    if (r !== null && r !== undefined) {
      if (i % 2 === 0) { s1 += r; s2 += 1 - r; } else { s2 += r; s1 += 1 - r; }
    }
    const wn = whiteIsP1 ? n1 : n2;
    const bn = whiteIsP1 ? n2 : n1;
    return `<div class="game">
      <div class="game-names">
        <div><span class="muted">P${i + 1}</span> <b>${esc(wn)}</b> <span class="muted">vs</span> <b>${esc(bn)}</b></div>
        <div class="small muted">Blancas: ${esc(wn)}</div>
      </div>
      <div class="row">
        <button class="res ${r === p1wins ? "on" : ""}" onclick="setEditMatchResult(${i},${p1wins})">Gana P1</button>
        <button class="res ${r === 0.5 ? "on" : ""}" onclick="setEditMatchResult(${i},0.5)">1/2</button>
        <button class="res ${r === p2wins ? "on" : ""}" onclick="setEditMatchResult(${i},${p2wins})">Gana P2</button>
      </div>
    </div>`;
  }).join("");
  wrap.innerHTML = `
    <div class="modal-back" id="modalBack" onclick="if(event.target.id==='modalBack')closeMatchEditor()">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editMatchTitle">
        <h3 id="editMatchTitle">Editar match</h3>
        <div class="modal-body">
          <div><b>${esc(n1)}</b> <span class="muted">vs</span> <b>${esc(n2)}</b> · ${esc(m.ritmo)} · ${editMatchResults.length} partidas</div>
          <div style="margin-top:10px"><label>Fecha del match</label>
            <input class="input" type="date" id="editMatchDate" value="${esc(editMatchDate)}" max="${todayLocal()}" onchange="editMatchDate=this.value"></div>
          <div class="bulk" style="margin-top:12px">
            <button class="btn btn-sm" onclick="bulkEditMatch('p1')">Gana P1 todas</button>
            <button class="btn btn-sm" onclick="bulkEditMatch('draw')">Todas 1/2</button>
            <button class="btn btn-sm" onclick="bulkEditMatch('p2')">Gana P2 todas</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-sm btn-ghost" onclick="resizeMatch(-1)" ${editMatchResults.length <= 1 ? "disabled" : ""}>Quitar partida</button>
            <button class="btn btn-sm btn-ghost" onclick="resizeMatch(1)" ${editMatchResults.length >= 999 ? "disabled" : ""}>Añadir partida</button>
            <span class="small muted">${editMatchResults.length} partida(s) · las blancas se alternan</span>
          </div>
          <div style="margin-top:6px">${games}</div>
          <div class="small muted" style="margin-top:10px">Marcador: <b>${f1(s1)} - ${f1(s2)}</b>. Al guardar se recalculan los ratings y los matches posteriores de estos jugadores.</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeMatchEditor()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveMatchEdit()">Guardar cambios</button>
        </div>
      </div>
    </div>`;
  wrap.classList.add("show");
  const box = wrap.querySelector(".modal");
  if (box) box.scrollTop = prevScroll;
}

function setEditMatchResult(i, v) {
  editMatchResults[i] = v;
  renderMatchEditor();
}

function bulkEditMatch(mode) {
  for (let i = 0; i < editMatchResults.length; i++) {
    const whiteIsP1 = i % 2 === 0;
    if (mode === "p1") editMatchResults[i] = whiteIsP1 ? 1 : 0;
    else if (mode === "p2") editMatchResults[i] = whiteIsP1 ? 0 : 1;
    else editMatchResults[i] = 0.5;
  }
  renderMatchEditor();
}

function resizeMatch(delta) {
  const n = editMatchResults.length + delta;
  if (n < 1 || n > 999) return;
  if (delta > 0) editMatchResults.push(1);
  else editMatchResults.pop();
  renderMatchEditor();
}

async function saveMatchEdit() {
  const m = editMatch;
  if (!m) return;
  const faltan = editMatchResults.filter(r => r === null || r === undefined).length;
  if (faltan) return toast(`Faltan ${faltan} resultados por marcar`, "bad");
  try {
    const r = await api("match_update", {
      match_id: m.id,
      results: editMatchResults.map(Number),
      date: editMatchDate
    });
    dashboard = r.dashboard;
    closeMatchEditor();
    render();
    toast("Match corregido", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
}

async function deleteMatch(matchId) {
  const m = (dashboard.matches || []).find(x => String(x.id) === String(matchId));
  if (!m) return;
  const ok = await uiModal({
    title: "Eliminar match",
    body: `Se eliminará el match <b>${esc(m.p1)} - ${esc(m.p2)}</b> (${m.np} partidas, ${esc(m.fecha ? String(m.fecha).slice(0, 10) : "")})`
        + " y se recalcularán los ratings de esos jugadores.",
    okText: "Eliminar", okClass: "btn-danger", danger: true
  });
  if (!ok) return;
  try {
    const r = await api("match_delete", {match_id: Number(matchId)});
    dashboard = r.dashboard;
    render();
    toast("Match eliminado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
}

/* ── Impresión / PDF de la clasificación ────────────────────────── */

function printHtml(t) {
  const filas = (t.standings || []).map(s => `<tr>
    <td>${s.pos}</td><td>${esc(s.name)}${s.withdrawn ? " (retirado)" : ""}</td>
    <td class="num">${f1(s.points)}</td><td class="num">${f1(s.bh1)}</td>
    <td class="num">${s.rating}</td><td class="num">${fv(s.v)}</td>
    <td class="num">${f1(s.de)}</td><td class="num">${f1(s.bh)}</td>
    <td class="num">${f1(s.sb)}</td><td class="num">${s.wins}</td>
    <td class="num">${f1(s.koya)}</td><td class="num">${round(s.aroc1)}</td>
    <td class="num">${s.tpr}</td></tr>`).join("");
  const byRound = {};
  (t.games || []).forEach(g => { (byRound[g.round] = byRound[g.round] || []).push(g); });
  const partidas = Object.keys(byRound).sort((a, b) => a - b).map(r =>
    `<tr><td>Ronda ${r}</td><td>${esc(byRound[r].map(g => g.white || "").join(", "))}</td>`
    + `<td>${esc(byRound[r].map(g => g.black || "").join(", "))}</td>`
    + `<td>${esc(byRound[r].map(g => g.result === 1 ? "1-0" : (g.result === 0 ? "0-1" : (g.result === 0.5 ? "1/2" : "-"))).join(", "))}</td></tr>`
  ).join("");
  return `<h1>${esc(t.name)}</h1>
    <div class="pmeta">${esc(t.rhythm)} · ${esc(TYPE_NAMES[t.type] || "Torneo")} · Ronda ${t.round_current}/${t.rounds_total}`
    + (t.date_start ? ` · ${esc(String(t.date_start).slice(0, 10))}` : "") + "</div>"
    + `<h2>Clasificación</h2>
    <table><thead><tr><th>#</th><th>Jugador</th><th class="num">Pts</th><th class="num">BH1</th>
      <th class="num">Rtg</th><th class="num">V</th><th class="num">DE</th><th class="num">BH</th>
      <th class="num">SB</th><th class="num">W</th><th class="num">Koya</th><th class="num">AROC1</th><th class="num">TPR</th>
    </tr></thead><tbody>${filas}</tbody></table>
    ${partidas ? `<h2>Partidas</h2><table><thead><tr><th>Ronda</th><th>Blancas</th><th>Negras</th><th>Resultado</th></tr></thead><tbody>${partidas}</tbody></table>` : ""}`;
}

function printTournament(t) {
  if (!t) return;
  el("#printArea").innerHTML = printHtml(t);
  window.print();
}

async function printTournamentById(id) {
  let t = null;
  if (dashboard && dashboard.current && Number(dashboard.current.id) === Number(id)) t = dashboard.current;
  else if (historyTournament && Number(historyTournament.id) === Number(id)) t = historyTournament;
  if (!t) {
    try {
      const r = await api("tournament_get", { tournament_id: id });
      t = r.tournament;
    } catch (e) { toast(cleanMessage(e), "bad"); return; }
  }
  printTournament(t);
}

/* ── Jugadores ─────────────────────────────────────────────────── */

function renderJugadores() {
  const players = (dashboard.players || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const edit = editingPlayer;
  const catOptions = CATEGORIES.map(c => `<option value="${esc(c)}" ${edit && edit.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("");
  const rows = players.map(p => {
    const per = p.partidas || {};
    const total = Number(p.partidas_total || 0);
    const rating = (r) => {
      const sl = (p.ratings || {})[r];
      return `<b>${round(sl ? sl.rating : 1500)}</b><div class="small muted">${per[r] || 0} p.</div>`;
    };
    return `
    <tr data-name="${esc(p.name)}">
      <td data-label="Nombre"><div class="cellv">${esc(p.name)}${total === 0 ? ' <span class="pill gray">Sin partidas</span>' : ""}</div></td>
      <td data-label="Categoría"><div class="cellv">${esc(p.cat)}</div></td>
      <td data-label="Municipio"><div class="cellv">${esc(p.mun)}</div></td>
      <td class="num" data-label="Rapid"><div class="cellv">${rating("Rapid")}</div></td>
      <td class="num" data-label="Blitz"><div class="cellv">${rating("Blitz")}</div></td>
      <td class="num" data-label="Bullet"><div class="cellv">${rating("Bullet")}</div></td>
      <td class="num" data-label="Partidas"><div class="cellv"><b>${total}</b></div></td>
      <td data-label=""><div class="cellv"><button class="btn btn-ghost btn-sm" onclick="startEditPlayer(${p.id})">Editar</button></div></td>
    </tr>`;
  }).join("");
  return `
    <div class="card">
      <h2>${edit ? "Editar jugador" : "Agregar jugador"}</h2>
      <div class="stack" style="margin-top:10px">
        <div><label>Nombre</label><input class="input" id="pName" value="${esc(playerForm.name)}" oninput="playerForm.name=this.value"></div>
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:130px"><label>Municipio</label><input class="input" id="pMun" value="${esc(playerForm.mun)}" oninput="playerForm.mun=this.value"></div>
          <div style="flex:1;min-width:120px"><label>Categoría</label><select id="pCat" onchange="playerForm.cat=this.value">${catOptions}</select></div>
        </div>
        <div><label>Foto (URL, opcional)</label><input class="input" id="pFoto" value="${esc(playerForm.foto)}" oninput="playerForm.foto=this.value" placeholder="https://..."></div>
        ${!edit ? `
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:130px"><label>Ritmo del rating inicial</label>
            <select id="pRhythm" onchange="playerForm.rhythm=this.value">
              ${["Blitz","Rapid","Bullet","Todos"].map(r => `<option value="${r}" ${playerForm.rhythm === r ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>
          <div style="flex:1;min-width:110px"><label>Rating inicial</label>
            <input class="input" id="pRating" type="number" min="600" max="4000" placeholder="1500" value="${esc(playerForm.rating)}" oninput="playerForm.rating=this.value; playerForm.dirty=true">
          </div>
          <div style="flex:1;min-width:100px"><label>RD inicial</label>
            <input class="input" id="pRd" type="number" min="45" max="500" placeholder="500" value="${esc(playerForm.rd)}" oninput="playerForm.rd=this.value; playerForm.dirty=true">
          </div>
        </div>
        <div class="small muted">Opcional. Se aplica solo al ritmo elegido; "Todos" aplica a Rapid, Blitz y Bullet. Si dejas rating o RD vacío se usa 1500/500. El jugador aparece en el ranking cuando tenga al menos una partida.</div>
        ` : `
        <div class="card" style="margin:0;background:var(--bg)">
          <h3 style="margin-bottom:8px">Estado interno</h3>
          <div class="table-wrap"><table id="pStateTable">
            <thead><tr><th>Ritmo</th><th class="num">Rating</th><th class="num">RD</th><th class="num">Partidas</th><th>Última actividad</th></tr></thead>
            <tbody>${RHYTHMS.map(r => {
              const sl = (edit.ratings || {})[r] || {};
              const n = (edit.partidas || {})[r] || 0;
              return `<tr><td>${r}</td><td class="num">${round(sl.rating || 1500)}</td>
                <td class="num">${Math.round((sl.rd || 500) * 10) / 10}</td>
                <td class="num">${n}</td>
                <td>${sl.last ? esc(String(sl.last).slice(0, 10)) : "-"}</td></tr>`;
            }).join("")}</tbody>
          </table></div>
          <div class="small muted" style="margin-top:8px">Datos internos: el ranking público solo muestra el rating redondeado. La variación se reinicia a 0 al corregir.</div>
        </div>
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:130px"><label>Corregir ritmo</label>
            <select id="pRhythm" onchange="setPlayerRhythm(this.value)">
              ${["Blitz","Rapid","Bullet","Todos"].map(r => `<option value="${r}" ${playerForm.rhythm === r ? "selected" : ""}>${r}</option>`).join("")}
            </select>
          </div>
          <div style="flex:1;min-width:110px"><label>Rating</label>
            <input class="input" id="pRating" type="number" min="600" max="4000" value="${esc(playerForm.rating)}" oninput="playerForm.rating=this.value; playerForm.dirty=true">
          </div>
          <div style="flex:1;min-width:100px"><label>RD</label>
            <input class="input" id="pRd" type="number" min="45" max="500" value="${esc(playerForm.rd)}" oninput="playerForm.rd=this.value; playerForm.dirty=true">
          </div>
        </div>
        <div class="small muted">Corrige el rating o el RD (600-4000 y 45-500). Se aplica al ritmo elegido; "Todos" aplica a los tres. No recalcula el historial pasado.</div>
        `}
        <div class="msg inline" id="pMsg"></div>
        <div class="row">
          <button class="btn btn-primary" onclick="savePlayer(event)">${edit ? "Guardar cambios" : "Agregar"}</button>

        </div>
      </div>

    <div class="card">

      </div>
      <div class="table-wrap" style="margin-top:8px"><table class="stack-mobile">
        <thead><tr><th>Nombre</th><th>Cat</th><th>Municipio</th><th class="num">Rapid</th><th class="num">Blitz</th><th class="num">Bullet</th><th class="num" title="Partidas jugadas en total">Part.</th><th></th></tr></thead>
        <tbody id="playerTable">${rows}</tbody>
      </table></div>
      <div class="legend">"Sin partidas" = todavía no aparece en el ranking público (necesita al menos una partida en ese ritmo). Debajo de cada rating, las partidas jugadas en ese ritmo.</div>
    </div>`;
}

function filterPlayerTable(q) {
  q = String(q || "").toLowerCase();
  document.querySelectorAll("#playerTable tr").forEach(row => {
    const name = (row.getAttribute("data-name") || "").toLowerCase();
    row.classList.toggle("hidden", q && !name.includes(q));
  });
}

function startEditPlayer(id) {
  editingPlayer = (dashboard.players || []).find(p => Number(p.id) === Number(id)) || null;
  if (editingPlayer) {
    const per = editingPlayer.partidas || {};
    const ritmo = RHYTHMS.slice().sort((a, b) => (per[b] || 0) - (per[a] || 0))[0] || "Blitz";
    const slot = (editingPlayer.ratings || {})[ritmo] || {};
    playerForm = {
      name: editingPlayer.name || "",
      mun: editingPlayer.mun || "Falcón",
      cat: editingPlayer.cat || "-",
      foto: editingPlayer.foto_url || "",
      rhythm: ritmo,
      rating: String(round(slot.rating || 1500)),
      rd: String(Math.round((slot.rd || 500) * 10) / 10),
      dirty: false,
    };
  }
  render();
  scrollToTop();
}
function cancelEditPlayer() {
  editingPlayer = null;
  playerForm = {name:"", mun:"Falcón", cat:"-", foto:"", rhythm:"Blitz", rating:"", rd:"", dirty:false};
  render();
}

function setPlayerRhythm(v) {
  playerForm.rhythm = v;
  if (editingPlayer && v !== "Todos") {
    const slot = (editingPlayer.ratings || {})[v] || {};
    playerForm.rating = String(round(slot.rating || 1500));
    playerForm.rd = String(Math.round((slot.rd || 500) * 10) / 10);
    playerForm.dirty = false;
  } else if (editingPlayer && v === "Todos") {
    playerForm.dirty = true;
  }
  render();
}

async function savePlayer(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Guardando\u2026")) return;
  try {
  const name = playerForm.name.trim();
  const mun = playerForm.mun.trim() || "Falcón";
  const cat = playerForm.cat || "-";
  const foto_url = playerForm.foto.trim();
  if (!name) { setInlineMsg("#pMsg", "El nombre es obligatorio"); toast("El nombre es obligatorio", "bad"); return; }
  setInlineMsg("#pMsg", "");
  try {
    const payload = {name, mun, cat, foto_url};
    const ratingRaw = (playerForm.rating || "").trim();
    const rdRaw = (playerForm.rd || "").trim();
    const aplica = editingPlayer ? playerForm.dirty : (ratingRaw || rdRaw);
    if (aplica && (ratingRaw || rdRaw)) {
      payload.rhythm = playerForm.rhythm;
      if (ratingRaw) payload.rating = Number(ratingRaw);
      if (rdRaw) payload.rd = Number(rdRaw);
    }
    let r;
    if (editingPlayer) r = await api("player_update", Object.assign({player_id: editingPlayer.id}, payload));
    else r = await api("player_create", payload);
    dashboard = r.dashboard;
    editingPlayer = null;
    playerForm = {name:"", mun:"Falcón", cat:"-", foto:"", rhythm:"Blitz", rating:"", rd:"", dirty:false};
    render();
    toast("Jugador guardado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  }
  finally { endBusy(btn); }
}

/* ── Historial ─────────────────────────────────────────────────── */

function renderHistorial() {
  const list = (dashboard.tournaments || []).map(t => `
    <div class="game">
      <div class="game-names"><b>${esc(t.name)}</b>
        <div class="small muted">${esc(t.rhythm)} · ${esc(TYPE_NAMES[t.type] || "Torneo")} · ${t.rounds_total} rondas · ${t.date_start ? esc(String(t.date_start).slice(0,10)) : ""}</div>
      </div>
      <div class="row">
        <span class="pill ${t.finished ? "gray" : ""}">${t.finished ? "Final" : "En curso"}</span>
        <button class="btn btn-ghost btn-sm" onclick="openHistory(${t.id})">Ver</button>
        <button class="btn btn-danger btn-sm" onclick="deleteTournament(${t.id},event)">Eliminar</button>
      </div>
    </div>`).join("") || `<div class="empty">Sin torneos.</div>`;
  const detail = historyTournament
    ? `<div class="card"><div class="row between">
        <h3>${esc(historyTournament.name)}</h3>
        <div class="row">
          <button class="btn btn-ghost btn-sm" onclick="printTournamentById(${historyTournament.id})">Imprimir</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTournament(${historyTournament.id},event)">Eliminar</button>
          <button class="btn btn-ghost btn-sm" onclick="closeHistory()">Cerrar</button>
        </div>
      </div>
      <div style="margin-top:8px">${renderStandings(historyTournament, false)}</div>
      <div style="margin-top:12px">${renderGames(historyTournament, true)}</div></div>`
    : "";
  return `<div class="card"><h2>Historial</h2><div class="muted" style="margin-bottom:8px">Todos los torneos.</div>${list}</div>${detail}`;
}

async function openHistory(id) {
  try {
    const r = await api("tournament_get", {tournament_id: id});
    historyTournament = r.tournament;
    render();
  } catch (e) { toast(cleanMessage(e), "bad"); }
}
function closeHistory() {
  historyTournament = null;
  render();
}

/* ── Importar ──────────────────────────────────────────────────── */

function renderImportar() {
  return `
      <p class="muted" style="margin:0 0 12px">
        Carga el archivo <b>falcon_seed_state.json</b> (migración inicial) o una copia
        descargada desde Ajustes. <b>Reemplaza el estado actual de Supabase.</b>
      </p>
      <div class="stack">
        <div><label>Archivo JSON</label><input class="input" type="file" id="seedFile" accept=".json,application/json"></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)">
          <input type="checkbox" id="forceImport" style="width:18px;height:18px;accent-color:var(--green)">
          Reemplazar datos existentes
        </label>
        <button class="btn btn-danger" onclick="importSeed(event)">Importar y reemplazar</button>
        <div class="msg small">Jugadores actuales: ${(dashboard.players || []).length} · Torneos: ${(dashboard.tournaments || []).length}</div>
      </div>`;
}

async function importSeed(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Importando\u2026")) return;
  try {
  const input = el("#seedFile");
  if (!input || !input.files || !input.files[0]) return toast("Elige el archivo JSON", "bad");
  let seed;
  try {
    seed = JSON.parse(await input.files[0].text());
  } catch (e) {
    return toast("El archivo no es un JSON válido", "bad");
  }
  const np = Array.isArray(seed.players) ? seed.players.length : 0;
  const nt = Array.isArray(seed.tournaments) ? seed.tournaments.length : 0;
  if (!np || !nt) return toast("El archivo no tiene players/tournaments", "bad");
  const ok = await uiModal({
    title: "Importar y reemplazar",
    body: `Se importarán <b>${np}</b> jugadores y <b>${nt}</b> torneos, <b>reemplazando</b> los datos actuales.`,
    okText: "Importar", okClass: "btn-danger", danger: true
  });
  if (!ok) return;
  const force = el("#forceImport") && el("#forceImport").checked;
  try {
    const r = await api("import_seed", {seed, force});
    dashboard = r;
    selectedPlayers.clear();
    tab = "torneo";
    render(false);
    toast(`Importados ${r.imported.players} jugadores y ${r.imported.tournaments} torneos`, "good");
  } catch (e) {
    if (e.status === 409) toast("Ya hay datos. Marca 'Reemplazar datos existentes'.", "bad");
    else toast(cleanMessage(e), "bad");
  }
  }
  finally { endBusy(btn); }
}

/* ── Ajustes ───────────────────────────────────────────────────── */

async function downloadBackup(silent = false) {
  const r = await api("state");
  const blob = new Blob([JSON.stringify(r.state, null, 1)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  a.href = url;
  a.download = `falcon_backup_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  if (!silent) toast("Copia descargada", "good");
}

async function deleteTournament(id, ev) {
  const t = (dashboard.tournaments || []).find(x => Number(x.id) === Number(id));
  const name = t ? t.name : "este torneo";
  const res = await uiModal({
    title: "Eliminar torneo",
    body: `Se descargará una copia de seguridad antes de eliminar <b>${esc(name)}</b>.<br><br>`
        + "<b>Ojo:</b> eliminar un torneo <b>no recalcula</b> los ratings actuales.<br><br>"
        + "Escribe <b>SI</b> para confirmar.",
    okText: "Eliminar", okClass: "btn-danger", danger: true,
    input: {placeholder: "SI"}
  });
  if (!res) { toast("Eliminación cancelada"); return; }
  if (String(res.value).toUpperCase() !== "SI") { toast("Para confirmar escribe SI", "bad"); return; }
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Eliminando\u2026")) return;
  try {
    await downloadBackup(true);
    const r = await api("tournament_delete", {tournament_id: id, confirm: true});
    dashboard = r.dashboard;
    if (historyTournament && Number(historyTournament.id) === Number(id)) historyTournament = null;
    render();
    toast("Torneo eliminado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

function renderAjustes() {
  return `
    <div class="card">
      <h2>Ajustes</h2>
      <div class="muted" style="margin:8px 0 12px">API v${esc(apiVersion)} · ${esc(adminName)}</div>
      <div class="stack">
        <div><label>PIN actual</label><input class="input" type="password" id="pinActual"></div>
        <div><label>PIN nuevo</label><input class="input" type="password" id="pinNuevo"></div>
        <div><label>Repite el PIN nuevo</label><input class="input" type="password" id="pinNuevo2"></div>
        <button class="btn btn-primary" onclick="changePin(event)">Cambiar PIN</button>
      </div>
    </div>
    <div class="card">
      <h3>Copia de seguridad</h3>
      <p class="small muted" style="margin:6px 0 10px">
        Descarga el estado completo (jugadores, torneos, partidas y matches).
        Para restaurar, usa la pestaña Importar.
      </p>
      <button class="btn" onclick="downloadBackup()">Descargar copia (.json)</button>
    </div>
    <div class="card zona">
      <h3>Zona avanzada · importar / restaurar</h3>
      <div class="small" style="color:#ff8a80;margin-bottom:10px">
        Reemplaza todos los datos actuales (jugadores, torneos, partidas y matches).
        Descarga antes una copia de seguridad.
      </div>
      ${renderImportar()}
    </div>
    <div class="card">
      <h3>Enlaces</h3>
      <div class="stack" style="margin-top:8px">
        <a class="link" href="https://falcon-live-ratings.vercel.app/" target="_blank" rel="noopener">Abrir Falcón Live Ratings</a>
        <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
      </div>
      <p class="small muted" style="margin-top:12px">
        Si acabas de crear el administrador, borra <b>SETUP_TOKEN</b> de las variables de Vercel.
      </p>
    </div>`;
}

async function changePin(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Cambiando\u2026")) return;
  try {
  const actual = el("#pinActual").value;
  const nuevo = el("#pinNuevo").value;
  const nuevo2 = el("#pinNuevo2").value;
  if (nuevo.length < 4) return toast("El PIN nuevo debe tener al menos 4 caracteres", "bad");
  if (nuevo !== nuevo2) return toast("Los PIN nuevos no coinciden", "bad");
  try {
    await api("pin_change", {current_pin: actual, new_pin: nuevo});
    toast("PIN cambiado", "good");
    render();
  } catch (e) { toast(cleanMessage(e), "bad"); }
  }
  finally { endBusy(btn); }
}

/* ── Arranque ──────────────────────────────────────────────────── */

async function boot() {
  applyDraft();
  await loadStatus();
  if (token) {
    try {
      await loadDashboard();
      return;
    } catch (e) {
      clearSession();
    }
  }
  if (!configured) showSetup();
  else showLogin();
}

boot();
