<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Falcón Admin</title>
<link rel="manifest" href="/manifest-admin.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Falcón Admin">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#121212;--bg2:#1e1e1e;--bg3:#2a2a2a;
  --text:#e8e8e8;--text2:#b3b3b3;--text3:#a8a8a8;
  --green:#8BC34A;--red:#f44336;--gold:#ffd54f;--blue:#42a5f5;
  --ok:#8BC34A;--warn:#ffd54f;--danger:#ff8a80;--danger-bg:rgba(244,67,54,.15);
  --border:#333;--line:#333;--radius:12px;
  /* Escala de espaciado, radios y tipografía (Fase 0) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r1:8px;--r2:12px;--r3:16px;--rfull:999px;
  --t1:11px;--t2:12px;--t3:13px;--t4:15px;--t5:18px;--t6:22px;
  --e1:0 1px 2px rgba(0,0,0,.35);--e2:0 8px 24px rgba(0,0,0,.45);
  --tap:44px;--tap-sm:40px;
  --ring:0 0 0 2px var(--bg),0 0 0 4px var(--green);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  font-size:var(--t3);line-height:1.45}
header{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.header-inner{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:17px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:var(--e1);display:block}
.brand-text{min-width:0}
.brand small{display:block;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.4px}
.user{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);min-width:0}
.who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stamp{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:var(--tap-sm);height:var(--tap-sm);flex:0 0 auto;display:inline-flex;align-items:center;
  justify-content:center;border-radius:var(--r1);border:1px solid var(--line);background:transparent;
  color:var(--text2);cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:#454545}
.icon-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:380px){.stamp{display:none}.who{max-width:84px}}

/* Barra de acción del torneo */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:var(--s3)}
.actions-main{display:flex;gap:8px;flex-wrap:wrap}
.actions-main .btn{flex:1 1 150px;white-space:nowrap}
@media (max-width:430px){
  .actions-main{flex-direction:column}
  .actions-main .btn{flex:0 0 auto;width:100%}
}
.actions-aux{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.actions[data-empty="1"] .actions-main{display:none}
.actions[data-empty="1"] .actions-aux{border-top:none;padding-top:0}
@media (min-width:640px){.actions-main .btn{flex:0 0 auto;min-width:190px}}
.modal--ficha{max-width:560px}
.ficha-load{padding:30px 0;text-align:center;color:var(--text2);font-size:var(--t3)}
.ficha-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ficha-name{font-size:var(--t5);font-weight:700;color:var(--text)}
.ficha-brief{font-size:var(--t2);color:var(--text2);margin-bottom:6px}
.ficha-brief b{color:var(--text)}
.ficha-sec{font-size:var(--t1);font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--gold);margin:14px 0 6px}
.ficha-sec:first-of-type{margin-top:10px}
.modal--ficha table{font-size:var(--t2);min-width:0}
.modal--ficha th,.modal--ficha td{padding:6px 4px}
.backup-note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;
  border:1px solid rgba(255,213,79,.35);background:rgba(255,213,79,.07);border-radius:var(--r1);
  font-size:var(--t2);color:var(--text2)}
.backup-note svg{width:16px;height:16px;flex:0 0 auto;color:var(--gold);margin-top:1px}
.backup-note b{color:var(--gold)}
.guide{padding:0;overflow:hidden}
.guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px}
.guide summary::-webkit-details-marker{display:none}
.guide-ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 auto;
  border-radius:9px;background:rgba(139,195,74,.12);color:var(--green)}
.guide-ic svg{width:17px;height:17px}
.guide-txt{display:flex;flex-direction:column;min-width:0}
.guide-txt b{font-size:var(--t3);color:var(--text)}
.guide-txt .small{color:var(--text3)}
.guide[open] summary{border-bottom:1px solid var(--line)}
.guide-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.guide-step{display:flex;gap:10px}
.guide-n{width:24px;height:24px;flex:0 0 auto;border-radius:50%;background:var(--bg3);color:var(--green);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.guide-step b{font-size:var(--t3)}
.guide-list{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:var(--t2);line-height:1.55}
.guide-list li{margin-bottom:4px}
.guide-list b{color:var(--text)}
.guide-warn{border:1px solid rgba(255,213,79,.35);background:rgba(255,213,79,.07);border-radius:var(--r1);
  padding:10px 12px;font-size:var(--t2);color:var(--text2)}
.guide-warn b{color:var(--gold);font-size:var(--t3)}
.guide-warn p{margin:4px 0 0}
.guide-warn--soft{border-color:var(--line);background:rgba(255,255,255,.03)}
.guide-warn--soft b{color:var(--text)}
.btn-x{width:34px;min-height:34px;padding:0;border:none;background:transparent;color:var(--text3);
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;
  line-height:1;cursor:pointer;font-family:inherit;transition:background .15s ease,color .15s ease}
.btn-x:hover{background:rgba(244,67,54,.14);color:var(--danger)}
.btn-x:focus-visible{outline:2px solid var(--green);outline-offset:2px}
nav.tabs{max-width:760px;margin:0 auto;padding:0 var(--s3);display:flex;gap:2px;overflow-x:auto;
  border-bottom:1px solid var(--line);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:none;border:none;color:var(--text3);min-height:var(--tap);padding:0 13px;font-size:12.5px;
  font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;
  border-radius:8px 8px 0 0;transition:color .15s ease,background .15s ease,border-color .15s ease}
.tab svg{width:15px;height:15px;flex:0 0 auto;opacity:.7;transition:opacity .15s ease}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--green);background:rgba(139,195,74,.10)}
.tab.active svg{opacity:1;color:var(--green)}
main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s3)}
.card h2{font-size:var(--t5);margin-bottom:2px;letter-spacing:-.2px}
.card h3{font-size:var(--t2);font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--gold);margin-bottom:var(--s2)}
.muted{color:var(--text2);font-size:var(--t2)}
.small{font-size:var(--t1)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:var(--t1);color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:.2px}
.input,select{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);
  border-radius:var(--r1);padding:10px 11px;font-size:16px;font-family:inherit;outline:none;
  min-height:var(--tap);transition:border-color .15s ease,box-shadow .15s ease}
.input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(139,195,74,.15)}
.input.err,select.err{border-color:rgba(244,67,54,.75);box-shadow:0 0 0 3px rgba(244,67,54,.12)}
.input:focus-visible,select:focus-visible,.btn:focus-visible,.tab:focus-visible,.res:focus-visible,.link:focus-visible{
  outline:2px solid var(--green);outline-offset:2px}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--text);min-height:var(--tap-sm);
  padding:0 14px;border-radius:var(--r1);font-size:var(--t3);font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;
  transition:filter .15s ease,transform .1s ease,background .15s ease,border-color .15s ease}
.btn:hover:not(:disabled){filter:brightness(1.15);border-color:#454545}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--green);border-color:var(--green);color:#000;min-height:var(--tap)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-danger{background:var(--danger-bg);border-color:rgba(244,67,54,.5);color:var(--danger)}
.btn-ghost{background:transparent}
a.btn{text-decoration:none}
.ic{width:15px;height:15px;flex:0 0 auto}
.btn-sm .ic,.btn-x .ic{width:13px;height:13px}
.btn-spin{width:13px;height:13px;flex:0 0 auto;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;opacity:.85;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-sm{min-height:34px;padding:0 10px;font-size:var(--t2);border-radius:7px}
.pill{display:inline-block;padding:3px 9px;border-radius:var(--rfull);font-size:10.5px;font-weight:700;
  letter-spacing:.2px;background:rgba(139,195,74,.15);color:var(--green);vertical-align:1px}
.pill.gold{background:rgba(255,213,79,.14);color:var(--gold)}
.pill.red{background:rgba(244,67,54,.15);color:#ff8a80}
.pill.gray{background:rgba(255,255,255,.08);color:var(--text2)}
.table-wrap{overflow-x:auto;margin:0 -4px}
table.stack-mobile{min-width:560px}
table{width:100%;border-collapse:collapse;font-size:var(--t2);min-width:420px;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
tbody tr:nth-child(odd){background:rgba(255,255,255,.02)}
tbody tr:hover{background:rgba(255,255,255,.045)}
td.num,th.num{text-align:right}
tr.withdrawn td{opacity:.5;text-decoration:line-through}
.v-up{color:var(--green)}.v-down{color:var(--red)}
.round{margin-top:14px}
.round-title{font-size:10.5px;font-weight:700;color:var(--text2);margin:12px 0 4px;
  letter-spacing:.6px;text-transform:uppercase}
.game{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.game:last-child{border-bottom:none}
.game-names{flex:1;min-width:180px;font-size:13px}
.game-names .bye{color:var(--text3)}
.res{background:var(--bg3);border:1px solid var(--line);color:var(--text2);border-radius:var(--r1);
  padding:8px 12px;font-size:var(--t3);font-weight:700;cursor:pointer;font-family:inherit;
  min-width:52px;min-height:var(--tap);transition:background .15s ease,border-color .15s ease,color .15s ease}
.res.on{background:var(--green);border-color:var(--green);color:#000}
.res:disabled{opacity:.5;cursor:not-allowed}
.player-pick{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border)}
.player-pick:last-child{border-bottom:none}
.player-pick input{width:18px;height:18px;accent-color:var(--green)}
.photo-row{display:flex;gap:12px;align-items:center}
.photo-prev{width:76px;height:76px;flex:0 0 auto;border-radius:12px;background:var(--bg3);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  overflow:hidden;color:var(--text3)}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-prev svg{width:26px;height:26px}
.player-pick .nm{flex:1;font-size:13px}
.player-pick .rt{font-size:11px;color:var(--text3)}
.hidden{display:none!important}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  padding:26px 12px;color:var(--text2);font-size:var(--t3)}
.empty .empty-ic{width:30px;height:30px;color:#5a5a5a;flex:0 0 auto}
.empty .btn{margin-top:2px}
.auth{max-width:420px;margin:28px auto}
.auth h2{margin-bottom:4px}
.auth .btn{width:100%;margin-top:6px}
.auth-back{display:block;text-align:center;text-decoration:none}
.link{background:none;border:none;color:var(--green);font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.msg{font-size:12px;color:#ff8a80;margin-top:8px;min-height:16px}
.msg.ok{color:var(--green)}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*{display:none!important}
  #printArea{display:block!important;padding:0;color:#000;font-size:12px}
  #printArea h1{font-size:18px;margin-bottom:2px}
  #printArea .pmeta{color:#444;margin-bottom:10px}
  #printArea table{width:100%;min-width:0;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:4px 5px;text-align:left;white-space:nowrap;color:#000}
  #printArea th{background:#eee;font-size:10px}
  #printArea td.num,#printArea th.num{text-align:right}
  #printArea h2{font-size:13px;margin:14px 0 4px}
}
#modalWrap{position:fixed;inset:0;z-index:100;display:none}
#modalWrap.show{display:block}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;
  justify-content:center;padding:18px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r3);padding:18px;
  max-width:420px;width:100%;box-shadow:var(--e2);max-height:85vh;overflow:auto;
  animation:modalIn .18s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
#app.view-enter{animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.modal.danger{border-color:rgba(244,67,54,.55)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal-body{font-size:13px;color:var(--text2);line-height:1.55}
.modal-body b{color:var(--text)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{min-width:96px;min-height:var(--tap);padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:10px 16px;
  border-radius:var(--r2);font-size:var(--t3);opacity:0;pointer-events:none;transition:all .2s;z-index:50;
  max-width:90vw;display:flex;align-items:center;gap:8px;box-shadow:var(--e2)}
.toast svg{width:16px;height:16px;flex:0 0 auto;color:var(--text2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:rgba(244,67,54,.6)}
.toast.good{border-color:rgba(139,195,74,.6)}
.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.bulk{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.hint{font-size:12px;color:var(--gold);margin-top:8px;font-weight:600}
.hint.ok{color:var(--green)}
.game{border-radius:8px}
.game .res.on{box-shadow:0 0 0 1px var(--green) inset}
nav.tabs{position:sticky;top:var(--header-h,58px);z-index:19;background:var(--bg);padding-top:2px}
.skel{background:linear-gradient(90deg,var(--bg3) 25%,#343434 50%,var(--bg3) 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.msg.inline{color:#ff8a80;font-size:12px;margin-top:8px}
.msg.inline.ok{color:var(--green)}
.zona{border-color:rgba(244,67,54,.45)}
.zona h3{color:#ff8a80}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filter-row select{flex:1;min-width:110px;font-size:14px;padding:8px 10px}
@media (max-width:480px){.filter-row select{flex:1 1 100%}}
.legend{font-size:11px;color:var(--text3);margin-top:8px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (max-width:560px){
  /* Modal como hoja inferior */
  .modal-back{align-items:flex-end;padding:0}
  .modal{max-width:100%;width:100%;border-radius:var(--r3) var(--r3) 0 0;
    max-height:92vh;box-shadow:0 -8px 40px rgba(0,0,0,.55);
    padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal::before{content:"";display:block;width:38px;height:4px;border-radius:2px;
    background:#3a3a3a;margin:0 auto 12px}
  .modal{animation:sheetIn .2s ease-out}
  @keyframes sheetIn{from{transform:translateY(24px);opacity:.55}to{transform:none;opacity:1}}
  /* Clasificación: en móvil basta con puesto, jugador, puntos y BH1 */
  .standings-tbl{min-width:0}
  .standings-tbl th:nth-child(5),.standings-tbl td:nth-child(5),
  .standings-tbl th:nth-child(6),.standings-tbl td:nth-child(6){display:none}
  .standings-tbl th:nth-child(7),.standings-tbl td:nth-child(7){width:46px;padding-left:0}
  /* Una sola tarjeta por fila: sin borde de tarjeta contenedora */
  .card:has(> .table-wrap > table.stack-mobile){background:transparent;border:none;padding:0}
  .card:has(> .table-wrap > table.stack-mobile) > h3{margin-bottom:var(--s2);padding-left:2px}
  table.stack-mobile{min-width:0}
  table.stack-mobile thead{display:none}
  table.stack-mobile tbody,table.stack-mobile tr,table.stack-mobile td{display:block;width:auto}
  table.stack-mobile tr{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:8px 10px;background:var(--bg3)}
  table.stack-mobile td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    border:none;padding:4px 0;white-space:normal}
  table.stack-mobile td::before{content:attr(data-label);color:var(--text3);font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px;flex:0 0 auto;padding-top:2px}
  table.stack-mobile td .cellv{flex:1;min-width:0;text-align:right}
  table.stack-mobile td .cellv>div{margin-top:1px}
  table.stack-mobile td.num{text-align:left}
  table.stack-mobile td:empty{display:none}
  table.stack-mobile td:last-child{padding-top:8px}
  table.stack-mobile td:last-child .cellv{text-align:right}
  table.stack-mobile td:last-child .btn{width:100%;padding:10px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <img class="brand-logo" src="/icons/icon-192.png" alt="" width="34" height="34">
      <div class="brand-text">Falcón Admin<small>Falcón Live Ratings</small></div>
    </div>

async function api(action, extra = {}) {
  const headers = {"Content-Type": "application/json"};
  if (token) headers["x-token"] = token;
  const res = await fetch(API, {
    method: "POST",
    headers,
    body: JSON.stringify(Object.assign({action}, extra))
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    if (res.status === 401 && action !== "login" && action !== "setup") {
      clearSession();
      showLogin("Sesión expirada. Entra de nuevo.");
    }
    const err = new Error(data.error || ("Error " + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function loadStatus() {
  try {

    const data = await res.json();
    configured = !!data.configured;
    apiVersion = data.version || "?";

  }
}

function saveDraft() {

    sessionStorage.setItem("falconDraft", JSON.stringify({
      tab, matchRhythm, matchP1, matchP2, matchGames, matchResults, matchDate,
      newName, newRounds, newType
    }));
  } catch (e) {}
}

function loadDraft() {
  try { return JSON.parse(sessionStorage.getItem("falconDraft") || "{}") || {}; }
  catch (e) { return {}; }
}

function applyDraft() {
  const d = loadDraft();
  if (!d || !Object.keys(d).length) return;
  if (d.tab) tab = d.tab === "importar" ? "ajustes" : d.tab;
  if (d.matchRhythm) matchRhythm = d.matchRhythm;
  if (d.matchP1 !== undefined) matchP1 = d.matchP1;
  if (d.matchP2 !== undefined) matchP2 = d.matchP2;
  if (d.matchDate) matchDate = d.matchDate;
  if (d.matchGames) matchGames = d.matchGames;
  if (Array.isArray(d.matchResults)) matchResults = d.matchResults;
  if (d.newName !== undefined) newName = d.newName;
  if (d.newRounds !== undefined) newRounds = d.newRounds;
  if (d.newType) newType = d.newType;
}

function reduceMotion() {

}

function scrollToTop() {

function uiModal(opts) {
  const o = Object.assign({
    title: "", body: "", okText: "Aceptar", okClass: "btn-primary",
    cancelText: "Cancelar", input: null, danger: false
  }, opts || {});
  return new Promise((resolve) => {
    const wrap = el("#modalWrap");
    const prevFocus = document.activeElement;
    const focusables = () => [...wrap.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )].filter(n => n.offsetParent !== null);
    const done = (v) => {
      wrap.innerHTML = "";
      wrap.classList.remove("show");
      document.removeEventListener("keydown", onKey);
      if (prevFocus && prevFocus.isConnected && typeof prevFocus.focus === "function") {
        try { prevFocus.focus(); } catch (e) {}
      }
      resolve(v);
    };
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); done(false); return; }
      if (e.key !== "Tab") return;
      const nodes = focusables();
      if (!nodes.length) return;
      const first = nodes[0], last = nodes[nodes.length - 1];
      const inside = wrap.contains(document.activeElement);
      if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
    };
    wrap.innerHTML = `
      <div class="modal-back" id="modalBack">
        <div class="modal ${o.danger ? "danger" : ""}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
          <h3 id="modalTitle">${esc(o.title)}</h3>
          ${o.body ? `<div class="modal-body">${o.body}</div>` : ""}
          ${o.input ? `<input class="input" id="modalInput" placeholder="${esc(o.input.placeholder || "")}" autocomplete="off">` : ""}
          <div class="modal-actions">
            <button class="btn btn-ghost" id="modalCancel">${esc(o.cancelText)}</button>
            <button class="btn ${o.okClass}" id="modalOk">${esc(o.okText)}</button>
          </div>
        </div>
      </div>`;
    wrap.classList.add("show");
    const input = el("#modalInput");
    if (input) { input.focus(); input.select(); }
    else if (!o.danger && el("#modalOk")) el("#modalOk").focus();
    else if (el("#modalCancel")) el("#modalCancel").focus();
    el("#modalCancel").onclick = () => done(false);
    el("#modalOk").onclick = () => {
      if (o.input && !input.value.trim()) { input.focus(); toast("Escribe el texto para confirmar", "bad"); return; }
      done(o.input ? {ok: true, value: input.value.trim()} : true);
    };
    el("#modalBack").onclick = (ev) => { if (ev.target.id === "modalBack") done(false); };
    document.addEventListener("keydown", onKey);
  });
}

    toast("Bienvenido", "good");
  } catch (e) {
    if (e.status === 409) {
      showSetup("Todavía no hay administrador. Crea el PIN inicial.");
      return;
    }
    msg.textContent = cleanMessage(e);
  }
}

async function doSetup(ev) {
  ev.preventDefault();
  const tokenIn = el("#setupToken").value.trim();
  const name = el("#setupName").value.trim() || "Administrador";
  const pin = el("#setupPin").value;

    await api("setup", {setup_token: tokenIn, name, pin});

    showLogin("Administrador creado. Entra con tu PIN.");

async function logout() {

/* ── Torneo actual ─────────────────────────────────────────────── */

function nextRound(t) {
  const has = (t.games || []).some(g => Number(g.round) === Number(t.round_current));
  return Number(t.round_current) + (has ? 1 : 0);
}

// Criterios de desempate que aplican al torneo (los define el motor).
// Si el payload no los trae (datos antiguos), se usan todos para no perder nada.
const CARD_CRITERIOS_FALLBACK = [
  {key:"buchholz_cut1",label:"BH1"},{key:"buchholz_total",label:"BH"},
  {key:"sonneborn_berger",label:"SB"},{key:"victorias",label:"W"},
  {key:"koya",label:"Koya"},{key:"aroc1",label:"AROC1"},
  {key:"direct_encounter",label:"DE"}
];
function criteriosDe(t){
  const c = (t && t.criterios) || [];
  return c.length ? c : CARD_CRITERIOS_FALLBACK;
}
function valorCriterio(s,key){
  switch(key){
    case "puntos": return f1(s.points);
    case "buchholz_cut1": return f1(s.bh1);
    case "buchholz_total": return f1(s.bh);
    case "sonneborn_berger": return f1(s.sb);
    case "victorias": return String(s.wins);
    case "koya": return f1(s.koya);
    case "aroc1": return round(s.aroc1);
    case "direct_encounter": return f1(s.de);
    default: return "";
  }
}
const TPR_TITULO = "Rendimiento estimado (no es el cálculo oficial de la FIDE)";

function renderStandings(t, allowWithdraw) {
  const crit = criteriosDe(t).filter(c => c.key !== "puntos");
  const rows = (t.standings || []).map(s => `
    <tr class="${s.withdrawn ? "withdrawn" : ""}">
      <td>${s.pos}</td>
      <td>${esc(s.name)} ${s.withdrawn ? '<span class="pill red">ret</span>' : ""}</td>
      <td class="num"><b>${f1(s.points)}</b></td>
      <td class="num">${f1(s.bh1)}</td>
      <td class="num">${s.rating}</td>
      <td class="num ${s.v > 0 ? "v-up" : (s.v < 0 ? "v-down" : "")}">${fv(s.v)}</td>
      ${allowWithdraw ? `<td class="num"><button class="btn-x" title="Retirar" aria-label="Retirar a ${esc(s.name)} del torneo" onclick="withdrawPlayer(${s.player_id},event)">×</button></td>` : ""}
    </tr>`).join("");
  return `<div class="table-wrap"><table class="standings-tbl">
    <thead><tr>
      <th scope="col">#</th><th scope="col">Jugador</th><th scope="col" class="num">Pts</th><th scope="col" class="num" title="Buchholz Cut 1">BH1</th>
      <th scope="col" class="num">Rtg</th><th scope="col" class="num" title="Variación de rating en el torneo">V</th>${allowWithdraw ? '<th scope="col"></th>' : ""}
    </tr></thead>
    <tbody>${rows}</tbody></table></div>
    <details class="detail small muted"><summary>Desempates completos</summary>
      <div class="table-wrap" style="margin-top:8px"><table><thead><tr>
        <th>#</th><th>Jugador</th>${crit.map(c => `<th class="num">${esc(c.label)}</th>`).join("")}
        <th class="num" title="${esc(TPR_TITULO)}">Rend. est.</th>
      </tr></thead><tbody>${(t.standings || []).map(s => `<tr>
        <td>${s.pos}</td><td>${esc(s.name)}</td>
        ${crit.map(c => `<td class="num">${valorCriterio(s, c.key)}</td>`).join("")}
        <td class="num" title="${esc(TPR_TITULO)}">${s.tpr}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="small muted" style="margin-top:6px">Solo se muestran los desempates que aplican a este torneo.

function renderGames(t, readonly) {
  if (!t.games || !t.games.length) {
    return `<div class="empty">${IC_EMPTY}<span>Aún no hay emparejamientos.</span></div>`;
  }
  const byRound = {};
  t.games.forEach(g => {
    const r = Number(g.round);
    (byRound[r] = byRound[r] || []).push(g);
  });
  return Object.keys(byRound).sort((a, b) => a - b).map(r => {
    const games = byRound[r].sort((a, b) => a.id - b.id).map(g => {
      if (g.bye) {
        return `<div class="game"><div class="game-names">${esc(g.white)} <span class="bye">— BYE (+1)</span></div></div>`;
      }
      const names = `<div class="game-names">${esc(g.white)} <span class="muted">vs</span> ${esc(g.black)}</div>`;
      if (readonly) {
        const res = g.result === 1 ? "1-0" : (g.result === 0 ? "0-1" : (g.result === 0.5 ? "½" : "—"));
        return `<div class="game">${names}<span class="muted">${res}</span></div>`;
      }
      return `<div class="game">${names}<div class="row">
        <button class="res ${g.result === 1 ? "on" : ""}" aria-label="Partida ${esc(g.white)} con blancas contra ${esc(g.black)}: ganan las blancas" onclick="saveResult(${g.id},1,event)">1-0</button>
        <button class="res ${g.result === 0.5 ? "on" : ""}" aria-label="Partida ${esc(g.white)} contra ${esc(g.black)}: empate" onclick="saveResult(${g.id},0.5,event)">½</button>
        <button class="res ${g.result === 0 ? "on" : ""}" aria-label="Partida ${esc(g.white)} con blancas contra ${esc(g.black)}: ganan las negras" onclick="saveResult(${g.id},0,event)">0-1</button>
      </div></div>`;
    }).join("");
    return `<div class="round"><div class="round-title">Ronda ${r}</div>${games}</div>`;
  }).join("");
}

function initials(name){
  const parts=(name||'').trim().split(/\s+/);
  const a=parts[0]?parts[0][0]:'';
  const b=parts.length>1?parts[parts.length-1][0]:'';
  return (a+b).toUpperCase();
}
/* ── Colores de categoría (igual que la web pública) ─────────────── */
const CAT_MAP={
  'Sub-8':  {bg:'#3a1f1f',fg:'#ef9a9a'}, // rojo/rosa
  'Sub-10': {bg:'#1f2b3a',fg:'#7ec8e8'}, // azul
  'Sub-12': {bg:'#2a1f3a',fg:'#c98ee8'}, // púrpura
  'Sub-14': {bg:'#3a2a1f',fg:'#ffb266'}, // naranja  (antes verde — ahora distinto a Sub-10)
  'Sub-16': {bg:'#1f302d',fg:'#66c4bd'}, // turquesa
  'Sub-18': {bg:'#3a321f',fg:'#ffd266'}, // amarillo
  'Sub-20': {bg:'#3a1f2a',fg:'#f48fb1'}, // magenta
  'Sub-22': {bg:'#1f253a',fg:'#9fa8da'}, // índigo
  'Sub-24': {bg:'#2a2a1f',fg:'#e0d266'}  // oliva
};
// Paleta de respaldo para categorías no listadas en CAT_MAP (evita repetir las ya asignadas).
const CAT_FALLBACK=[
  {bg:'#1f2b1a',fg:'#9ec46a'}, // verde lima (libre ahora que Sub-14 ya no lo usa)
  {bg:'#2a1f1f',fg:'#e0a0a0'}, // rojo claro
  {bg:'#1f2a2a',fg:'#7ed4d4'}, // cian
  {bg:'#332a19',fg:'#e0b26a'}  // ámbar
];
const CAT_DEFAULT={bg:'#232323',fg:'#aaaaaa'};
function catColor(cat){
  if(!cat||cat==='-')return CAT_DEFAULT;
  if(CAT_MAP[cat])return CAT_MAP[cat];
  // Categoría no listada: asignar un color de respaldo de forma determinista por hash,
  // sin repetir los colores ya usados en CAT_MAP.
  let h=0;
  for(let i=0;i<cat.length;i++)h=(h*31+cat.charCodeAt(i))>>>0;
  return CAT_FALLBACK[h%CAT_FALLBACK.length];
}
// Foto del jugador: usa p.foto y, si falta (p. ej. snapshot antiguo del
// ranking), la toma del historial por nombre.
function playerPhoto(p){
  if(!p)return '';
  if(p.foto)return p.foto;
  const name=p.n||p.name;
  const hist=name&&data&&data.historial?data.historial[name]:null;
  return (hist&&hist.foto)||'';
}


/* ── Utilidades de exportación a CSV (Excel) ─────────────────────── */

function csvCampo(v) {
  const s = String(v === null || v === undefined ? "" : v);
  return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCSV(nombreArchivo, cabeceras, filas) {
  try {
    const lineas = [cabeceras.join(";")];
    for (const fila of filas) lineas.push(fila.map(csvCampo).join(";"));
    // BOM + ";" → se abre bien en Excel en español
    const csv = "\uFEFF" + lineas.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("CSV descargado", "info");
  } catch (e) {
    toast("No se pudo generar el CSV", "bad");
  }
}

function csvFecha() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function exportarClasificacionCSV(t) {
  if (!t || !t.standings || !t.standings.length) { toast("No hay clasificación que exportar", "bad"); return; }
  const crit = criteriosDe(t);
  const cabeceras = ["Puesto", "Jugador", "Categoría", "Municipio", "Puntos"]
    .concat(crit.filter(c => c.key !== "puntos").map(c => c.label))
    .concat(["Rating", "Variación", "Rend. est."]);
  const filas = t.standings.map(s => [
    s.pos, s.name, s.cat || "-", s.mun || "-", s.points
  ].concat(crit.filter(c => c.key !== "puntos").map(c => valorCriterio(s, c.key)))
   .concat([s.rating, s.v, s.tpr]));
  const nombre = `clasificacion-${(t.name || "torneo").toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${csvFecha()}.csv`;
  downloadCSV(nombre, cabeceras, filas);
}

function exportarJugadoresCSV() {
  const players = (dashboard.players || []).slice();
  if (!players.length) { toast("No hay jugadores que exportar", "bad"); return; }
  const cabeceras = ["Nombre", "Categoría", "Municipio", "Foto"];
  for (const r of RHYTHMS) cabeceras.push(`${r} rating`, `${r} RD`, `${r} partidas`, `${r} variación`);
  cabeceras.push("Partidas totales");
  const filas = players.map(p => {
    const base = [p.name, p.cat || "-", p.mun || "-", p.foto_url || ""];
    for (const r of RHYTHMS) {
      const sl = (p.ratings || {})[r] || {};
      const per = (p.partidas || {})[r] || 0;
      base.push(round(sl.rating || 1500), Math.round((sl.rd || 500) * 10) / 10, per, sl.var || 0);
    }
    base.push(p.partidas_total || 0);
    return base;
  });
  downloadCSV(`jugadores-${csvFecha()}.csv`, cabeceras, filas);
}

function exportarMatchesCSV() {
  const matches = dashboard.matches || [];
  if (!matches.length) { toast("No hay matches que exportar", "bad"); return; }
  const cabeceras = ["Fecha", "Ritmo", "Jugador 1", "Puntos 1", "Jugador 2", "Puntos 2", "Partidas", "Variación 1", "Variación 2"];
  const filas = matches.map(m => [
    (m.fecha || "").slice(0, 10), m.ritmo, m.p1, m.score1, m.p2, m.score2, m.np, m.var1, m.var2
  ]);
  downloadCSV(`matches-${csvFecha()}.csv`, cabeceras, filas);
}

/* ── Ordenar la tabla de jugadores ────────────────────────────────── */

const JUGADOR_ORDENES = [
  { key: "name", label: "Nombre" },
  { key: "rapid", label: "Rapid" },
  { key: "blitz", label: "Blitz" },
  { key: "bullet", label: "Bullet" },
  { key: "games", label: "Partidas" },
  { key: "cat", label: "Categoría" }
];

function playerSortValue(p, key) {
  if (key === "name") return String(p.name || "").toLowerCase();
  if (key === "cat") return String(p.cat || "-").toLowerCase();
  if (key === "games") return Number(p.partidas_total || 0);
  const r = key.charAt(0).toUpperCase() + key.slice(1);
  return Number((((p.ratings || {})[r]) || {}).rating || 1500);
}

function ordenarJugadores(players) {
  const { key, dir } = playerSort;
  return players.slice().sort((a, b) => {
    const va = playerSortValue(a, key);
    const vb = playerSortValue(b, key);
    let cmp;
    if (typeof va === "number" && typeof vb === "number") cmp = va - vb;
    else cmp = String(va).localeCompare(String(vb), "es");
    if (cmp === 0) cmp = String(a.name || "").localeCompare(String(b.name || ""), "es");
    return cmp * dir;
  });
}

function setPlayerSort(key) {
  if (playerSort.key === key) playerSort.dir = playerSort.dir * -1;
  else { playerSort.key = key; playerSort.dir = (key === "name" || key === "cat") ? 1 : -1; }
  render();
}

      <summary class="guide-sum">
        <span class="guide-ic">${ic("clipboard")}</span>
        <span class="guide-txt"><b>Guía del torneo</b><span class="small muted">Qué hacer, paso a paso (léela 5 min antes de empezar)</span></span>
      </summary>
      <div class="guide-body">
        <div class="guide-step">
          <div class="guide-n">1</div>
          <div>
            <b>Antes de empezar (con calma)</b>
            <ul class="guide-list">
              <li>Entra al panel y ve a <b>Ajustes → Descargar copia (.json)</b>. Es tu red de seguridad: si algo sale mal, se restaura con “Importar”.</li>
              <li>Crea el torneo en <b>Nuevo</b>: nombre, sistema, <b>ritmo</b> (revisa que sea el correcto) y rondas (vacío = automático).</li>
              <li>Selecciona los jugadores con el buscador y los filtros. Antes de crear, el panel resume <b>“N jugadores · X rondas · ritmo Y”</b>: ese resumen es tu control.</li>
              <li>Confirma que estén todos y solo los que van a jugar (los que no van, fuera).</li>
            </ul>
          </div>
        </div>
        <div class="guide-step">
          <div class="guide-n">2</div>
          <div>
            <b>Cada ronda</b>
            <ul class="guide-list">
              <li><b>Emparejar ronda N</b>: el emparejamiento es automático. Mira que nadie quede emparejado consigo mismo, que el descanso (bye) caiga bien con número impar de jugadores y que los colores alternen.</li>
              <li>Marca el resultado de cada partida: <b>1-0 · ½ · 0-1</b>. Ojo, la fila indica “Blancas: X · Negras: Y” porque los colores alternan.</li>
              <li><b>Cada toque guarda solo</b>: no hay botón “Guardar”. Si ves el aviso <b>“Faltan N resultados por guardar”</b>, todavía no hay resultados pendientes: no se puede emparejar la ronda siguiente ni cerrar.</li>
              <li>Si alguien se retira: la <b>×</b> en la tabla de clasificación. Deja de emparejársele.</li>
            </ul>
          </div>
        </div>
        <div class="guide-warn">
          <b>La trampa del orden</b>
          <p>No registres <b>matches sueltos 1v1 con el torneo abierto</b>. El torneo recalcula el rating del jugador
          desde su rating inicial y <b>pisa</b> el efecto de un match posterior. Regístralos <b>antes</b> de empezar
          el torneo (con su fecha) o <b>después</b> de cerrarlo.</p>
          <p>Y ten en cuenta que los ratings se recalculan y <b>se publican con cada resultado guardado</b>:
          el ranking público se mueve en vivo, no solo al cerrar.</p>
        </div>
        <div class="guide-step">
          <div class="guide-n">3</div>
          <div>
            <b>Al cerrar</b>
            <ul class="guide-list">
              <li><b>Cerrar torneo</b> cuando termines todas las rondas (o decidas cortar). Consolida la clasificación final y los ratings.</li>
              <li>Vuelve a <b>descargar una copia</b> (estado final).</li>
            </ul>
          </div>
        </div>
        <div class="guide-step">
          <div class="guide-n">4</div>
          <div>
            <b>Después del torneo</b>
            <ul class="guide-list">
              <li>Revisa la <b>web pública</b>: el ranking, el perfil del jugador y la pestaña Torneo.</li>
              <li>Genera la <b>tarjeta de imagen</b> de algún jugador (queda lista para compartir).</li>
              <li>En <b>Historial → Ver → Imprimir</b> sale la clasificación en PDF: el acta del torneo.</li>
            </ul>
          </div>
        </div>
        <div class="guide-warn guide-warn--soft">
          <b>Si algo sale mal</b>
          <ul class="guide-list">
            <li>Un resultado mal cargado: vuelve a tocar ese resultado y se guarda otra vez.</li>
            <li>Un match 1v1 mal registrado: <b>Matches → Editar</b> (puedes cambiar resultados y fecha) o <b>Eliminar</b>.</li>
            <li><b>Eliminar un torneo no recalcula los ratings</b>: por eso la copia de seguridad es clave.</li>
          </ul>
        </div>
      </div>
    </details>`;
}

function abrirGuiaTorneo() {
  setTab("torneo");
  const g = el("#guiaTorneo");
  if (g) {
    g.open = true;
    g.scrollIntoView({ block: "start", behavior: reduceMotion() ? "auto" : "smooth" });
  }
}
function renderTorneo() {
  if (!dashboard.current) {
    return renderGuiaTorneo() + `<div class="card"><div class="empty">${IC_TROPHY}<span>No hay ningún torneo todavía.</span>

async function reload() {
  try { await loadDashboard(); toast("Actualizado"); }
  catch (e) { toast(cleanMessage(e), "bad"); }
}

async function saveResult(gameId, value, ev) {
  if (!dashboard.current || dashboard.current.finished) return;
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "...")) return;
  try {
    const r = await api("result_save", {
      tournament_id: dashboard.current.id,
      results: [{game_id: gameId, result: value}]
    });
    dashboard = r.dashboard;
    render();
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

async function pairRound(ev) {
  if (!dashboard.current) return;
  const t = dashboard.current;
  const ok = await uiModal({
    title: "Emparejar ronda",
    body: `¿Emparejar la ronda <b>${nextRound(t)}</b> de <b>${esc(t.name)}</b>?`,
    okText: "Emparejar"
  });
  if (!ok) return;
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Emparejando\u2026")) return;
  try {
    const r = await api("round_pair", {tournament_id: t.id});
    dashboard = r.dashboard;
    render(false);
    toast(`Ronda ${r.pairing.round} emparejada`, "good");
  } catch (e) {
    if (e.status === 409 && e.data && e.data.pending) {
      toast(`Faltan ${e.data.pending.length} resultados en la ronda actual.`, "bad");
    } else {
      toast(cleanMessage(e), "bad");
    }
  }
  finally { endBusy(btn); }
}

async function closeTournament(ev) {

}

async function withdrawPlayer(playerId, ev) {

/* ── Nuevo torneo ──────────────────────────────────────────────── */

function setNewType(v) {
  newType = Number(v);
  render();
}
function setNewRhythm(v) {
  newRhythm = v;
  render();
}
function togglePlayer(id, checked) {
  if (checked) selectedPlayers.add(Number(id));
  else selectedPlayers.delete(Number(id));
  const c = document.getElementById("selCount");
  if (c) c.textContent = `Jugadores (${selectedPlayers.size} seleccionados)`;
}
function filterPlayers(q) {
  newQuery = String(q || "");
  q = newQuery.toLowerCase();
  document.querySelectorAll("#playerPicks .player-pick").forEach(row => {
    const name = (row.getAttribute("data-name") || "").toLowerCase();
    row.classList.toggle("hidden", q && !name.includes(q));
  });
}

function setNewFilter(kind, v) {
  if (kind === "cat") newCatFilter = v; else newMunFilter = v;
  render();
}

function setAllPlayers(checked) {
  document.querySelectorAll("#playerPicks .player-pick:not(.hidden) input[type=checkbox]").forEach(cb => {
    cb.checked = checked;
    togglePlayer(Number(cb.value), checked);
  });
  render();
}

function autoRounds(n, type) {
  if (n < 2) return 0;
  if (type === 1) return Math.max(1, Math.ceil(Math.log2(Math.max(2, n))));
  if (type === 2) return n % 2 === 0 ? n - 1 : n;
  return n % 2 === 0 ? (n - 1) * 2 : n * 2;
}

function setInlineMsg(id, text, ok) {
  const n = el(id);
  if (!n) return;
  n.textContent = text || "";
  n.className = "msg inline" + (ok ? " ok" : "");
}

function renderNuevo() {
  const players = (dashboard.players || []).slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
  if (players.length < 2) {
    return `<div class="card"><div class="empty">${IC_EMPTY}<span>Necesitas al menos 2 jugadores.</span>
      <button class="btn btn-primary" onclick="setTab('jugadores')">${ic("plus")}Agregar jugadores</button></div></div>`;
  }
  const cats = Array.from(new Set(players.map(p => p.cat || "-"))).sort();
  const muns = Array.from(new Set(players.map(p => p.mun || "-"))).sort();
  const visible = players.filter(p =>
    (!newCatFilter || (p.cat || "-") === newCatFilter) &&
    (!newMunFilter || (p.mun || "-") === newMunFilter));
  const picks = visible.map(p => {
    const slot = (p.ratings || {})[newRhythm] || {};
    const checked = selectedPlayers.has(Number(p.id)) ? "checked" : "";
    return `<label class="player-pick" data-name="${esc(p.name)}">
      <input type="checkbox" value="${p.id}" ${checked} onchange="togglePlayer(${p.id}, this.checked)">
      <span class="nm">${esc(p.name)}</span>
      <span class="rt">${round(slot.rating || 1500)}</span>
    </label>`;
  }).join("");
  const rr = newType !== 1;
  const nSel = selectedPlayers.size;
  const rondasManual = (newType === 1 && newRounds) ? Number(newRounds) : null;
  const rondas = rondasManual || autoRounds(nSel, newType);
  const resumen = nSel < 2
    ? "Selecciona al menos 2 jugadores."
    : `${nSel} jugadores \u00b7 ${rondas} rondas (${rondasManual ? "manual" : "automático"}) \u00b7 ritmo ${newRhythm}`;
  return `
    <div class="card">
      <h2>Nuevo torneo</h2>
      <div class="small muted" style="margin-top:2px">Empieza hoy. Si es para otra fecha, prepara antes la lista en <b>Inscripciones</b>.</div>
      <div class="stack" style="margin-top:12px">
        <div><label>Nombre</label><input class="input" id="tName" value="${esc(newName)}" oninput="newName=this.value" placeholder="Blitz RR II"></div>
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:140px"><label>Sistema</label>
            <select onchange="setNewType(this.value)">
              <option value="1" ${newType === 1 ? "selected" : ""}>Suizo (FIDE)</option>
              <option value="2" ${newType === 2 ? "selected" : ""}>Round Robin 1V</option>
              <option value="3" ${newType === 3 ? "selected" : ""}>Round Robin 2V</option>
            </select>
          </div>
          <div style="flex:1;min-width:120px"><label>Ritmo</label>
            <select onchange="setNewRhythm(this.value)">
              <option value="Rapid" ${newRhythm === "Rapid" ? "selected" : ""}>Rapid</option>
              <option value="Blitz" ${newRhythm === "Blitz" ? "selected" : ""}>Blitz</option>
              <option value="Bullet" ${newRhythm === "Bullet" ? "selected" : ""}>Bullet</option>
            </select>
          </div>
        </div>
        ${!rr ? `<div><label>Rondas</label>
          <input class="input" type="number" min="1" max="99" id="tRounds" value="${esc(newRounds)}" oninput="newRounds=this.value" placeholder="Automático"></div>` : ""}
        <div>
          <div class="row between">
            <label id="selCount">Jugadores (${nSel} seleccionados)</label>
            <span class="row" style="gap:6px">
              <button class="btn btn-sm" onclick="setAllPlayers(true)">Todos</button>
              <button class="btn btn-sm btn-ghost" onclick="setAllPlayers(false)">Ninguno</button>
            </span>
          </div>
          <input class="input" placeholder="Buscar jugador..." aria-label="Buscar jugador para el torneo" value="${esc(newQuery)}" oninput="filterPlayers(this.value)" style="margin-bottom:8px">
          <div class="filter-row">
            <select aria-label="Filtrar por categoría" onchange="setNewFilter('cat', this.value)">
              <option value="">Todas las categorías</option>
              ${cats.map(c => `<option value="${esc(c)}" ${newCatFilter === c ? "selected" : ""}>${esc(c)}</option>`).join("")}
            </select>
            <select aria-label="Filtrar por municipio" onchange="setNewFilter('mun', this.value)">
              <option value="">Todos los municipios</option>
              ${muns.map(m => `<option value="${esc(m)}" ${newMunFilter === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
            </select>
          </div>
          <div id="playerPicks" style="max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:8px">
            ${picks || `<div class="empty">${IC_EMPTY}<span>Sin jugadores con ese filtro.</span></div>`}
          </div>
        </div>
        <div class="hint ${nSel >= 2 ? "ok" : ""}">${esc(resumen)}</div>
        <div class="msg inline" id="tMsg"></div>
        <button class="btn btn-primary" onclick="createTournament(event)">${ic("check")}Crear torneo</button>
      </div>
    </div>`;
}

async function createTournament(ev) {
  const name = (el("#tName") ? el("#tName").value : newName).trim();
  if (!name) { setInlineMsg("#tMsg", "Pon un nombre al torneo"); toast("Pon un nombre al torneo", "bad"); return; }
  const ids = Array.from(selectedPlayers);
  if (ids.length < 2) { setInlineMsg("#tMsg", "Selecciona al menos 2 jugadores"); toast("Selecciona al menos 2 jugadores", "bad"); return; }
  setInlineMsg("#tMsg", "");
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Creando\u2026")) return;
  try {
    const r = await api("tournament_create", {
      name, type: newType, rhythm: newRhythm,
      rounds_total: newType === 1 ? (newRounds || null) : null,
      player_ids: ids
    });
    dashboard = r.dashboard;
    selectedPlayers.clear();
    newName = ""; newRounds = ""; newType = 1; newRhythm = "Blitz";
    tab = "torneo";
    render(false);
    toast("Torneo creado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

/* ── Matches 1v1 ───────────────────────────────────────────────── */

function setMatchRhythm(v) { matchRhythm = v; render(); }
function setMatchPlayer(n, v) {
  if (n === 1) matchP1 = v; else matchP2 = v;
  render();
}
function setMatchGames(v) {
  matchGames = Math.max(1, Math.min(999, Number(v) || 1));
  const next = [];
  for (let i = 0; i < matchGames; i++) next.push(i < matchResults.length ? matchResults[i] : null);
  matchResults = next;
  render();
}
function setMatchResult(i, v) { matchResults[i] = v; render(); }
function bulkMatchResult(mode) {
  for (let i = 0; i < matchGames; i++) {
    const whiteIsP1 = i % 2 === 0;
    if (mode === "p1") matchResults[i] = whiteIsP1 ? 1 : 0;
    else if (mode === "p2") matchResults[i] = whiteIsP1 ? 0 : 1;
    else if (mode === "draw") matchResults[i] = 0.5;
    else matchResults[i] = null;
  }
  render();
}

function matchScore() {
  let s1 = 0, s2 = 0;
  for (let i = 0; i < matchGames; i++) {
    const r = matchResults[i];
    if (r === null || r === undefined) continue;
    if (i % 2 === 0) { s1 += r; s2 += 1 - r; }
    else { s2 += r; s1 += 1 - r; }
  }
  return {s1, s2};
}

function renderMatches() {
  const players = (dashboard.players || []).slice().sort((a, b) => {
    const ra = ((a.ratings || {})[matchRhythm] || {}).rating || 1500;
    const rb = ((b.ratings || {})[matchRhythm] || {}).rating || 1500;
    return rb - ra;
  });
  if (players.length < 2) {
    return `<div class="card"><div class="empty">${IC_EMPTY}<span>Necesitas al menos 2 jugadores.</span>
      <button class="btn btn-primary" onclick="setTab('jugadores')">${ic("plus")}Agregar jugadores</button></div></div>`;
  }
  const slot = (p) => ((p.ratings || {})[matchRhythm] || {}).rating || 1500;
  const opts = (selected) => `<option value="">Elegir jugador</option>` + players.map(p =>
    `<option value="${p.id}" ${String(selected) === String(p.id) ? "selected" : ""}>${esc(p.name)} (${round(slot(p))})</option>`
  ).join("");
  const p1 = players.find(p => String(p.id) === String(matchP1));
  const p2 = players.find(p => String(p.id) === String(matchP2));
  const name1 = p1 ? p1.name : "P1";
  const name2 = p2 ? p2.name : "P2";

  const games = Array.from({length: matchGames}, (_, i) => {
    const whiteIsP1 = i % 2 === 0;
    const p1wins = whiteIsP1 ? 1 : 0;
    const p2wins = whiteIsP1 ? 0 : 1;
    const wn = p1 ? esc(p1.name) : "—";
    const bn = p2 ? esc(p2.name) : "—";
    const whiteName = whiteIsP1 ? wn : bn;
    const blackName = whiteIsP1 ? bn : wn;
    const r = matchResults[i];
    const labelP1 = p1 ? p1.name : "P1";
    const labelP2 = p2 ? p2.name : "P2";
    return `<div class="game">
      <div class="game-names">
        <div><span class="muted">P${i + 1}</span> <b>${wn}</b> <span class="muted">vs</span> <b>${bn}</b></div>
        <div class="small muted">Blancas: ${whiteName} · Negras: ${blackName}</div>
      </div>
      <div class="row">
        <button class="res ${r === p1wins ? "on" : ""}" aria-label="Partida ${i + 1}: gana ${esc(labelP1)}" onclick="setMatchResult(${i},${p1wins})">Gana P1</button>
        <button class="res ${r === 0.5 ? "on" : ""}" aria-label="Partida ${i + 1}: empate" onclick="setMatchResult(${i},0.5)">½</button>
        <button class="res ${r === p2wins ? "on" : ""}" aria-label="Partida ${i + 1}: gana ${esc(labelP2)}" onclick="setMatchResult(${i},${p2wins})">Gana P2</button>
      </div>
    </div>`;
  }).join("");

  const sc = matchScore();
  const faltan = matchResults.filter(r => r === null || r === undefined).length;
  const mismos = !!(matchP1 && matchP2 && String(matchP1) === String(matchP2));
  let hint = "", hintOk = false;
  if (!matchP1 || !matchP2) hint = "Elige el jugador 1 y el jugador 2.";
  else if (mismos) hint = "Los dos jugadores deben ser distintos.";
  else if (faltan) hint = `Faltan ${faltan} resultado${faltan === 1 ? "" : "s"} por marcar.`;
  else { hint = "Todo listo. Puedes registrar el match."; hintOk = true; }
  const allMatches = dashboard.matches || [];
  const filteredMatches = matchListRhythm === "Todos" ? allMatches : allMatches.filter(m => m.ritmo === matchListRhythm);
  const shownMatches = filteredMatches.slice(0, matchListLimit);
  const recent = shownMatches.map(m => `
    <div class="game">
      <div class="game-names"><b>${esc(m.p1)}</b> ${f1(m.score1)} - ${f1(m.score2)} <b>${esc(m.p2)}</b>
        <div class="small muted">${esc(m.ritmo)} · ${m.np} partidas · ${m.fecha ? esc(String(m.fecha).slice(0, 10)) : ""}</div>
      </div>
      <div class="row">
        <div class="small"><span class="${m.var1 > 0 ? "v-up" : (m.var1 < 0 ? "v-down" : "")}">${fv(m.var1)}</span>
          / <span class="${m.var2 > 0 ? "v-up" : (m.var2 < 0 ? "v-down" : "")}">${fv(m.var2)}</span></div>
        <button class="btn btn-sm" onclick="openMatchEditor(${m.id})">${ic("pencil")}Editar</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMatch(${m.id})">${ic("trash")}Eliminar</button>
      </div>
    </div>`).join("") || `<div class="empty">${IC_EMPTY}<span>Sin matches todavía.</span></div>`;
  const masMatches = filteredMatches.length > matchListLimit
    ? `<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="matchListLimit += 10; render()">Ver más (${filteredMatches.length - matchListLimit} restantes)</button>`
    : "";

  return `
    <div class="card">
      <h2>Match 1v1</h2>
      <p class="muted" style="margin:6px 0 12px">Los colores alternan: partida 1 P1 blancas, partida 2 P2 blancas, etc.</p>
      <div class="stack">
        <div class="row" style="gap:10px">
          <div style="flex:1;min-width:130px"><label>Ritmo</label>
            <select onchange="setMatchRhythm(this.value)">
              <option value="Rapid" ${matchRhythm === "Rapid" ? "selected" : ""}>Rapid</option>
              <option value="Blitz" ${matchRhythm === "Blitz" ? "selected" : ""}>Blitz</option>
              <option value="Bullet" ${matchRhythm === "Bullet" ? "selected" : ""}>Bullet</option>
            </select>
          </div>
          <div style="flex:1;min-width:110px"><label>Partidas</label>
            <input class="input" type="number" min="1" max="999" value="${matchGames}" onchange="setMatchGames(this.value)">
          </div>
        </div>
        <div><label>Fecha del match</label>
          <input class="input" type="date" value="${esc(matchDate)}" max="${todayLocal()}" onchange="matchDate=this.value">
          <div class="small muted" style="margin-top:4px">Puedes poner una fecha pasada (ej. 2026-08-09).</div>
        </div>
        <div><label>Jugador 1</label><select onchange="setMatchPlayer(1,this.value)">${opts(matchP1)}</select></div>
        <div><label>Jugador 2</label><select onchange="setMatchPlayer(2,this.value)">${opts(matchP2)}</select></div>
        <div class="card" style="margin:0;background:var(--bg)">
          <div class="row between"><b>Partidas</b><span class="muted">${esc(name1)} ${f1(sc.s1)} - ${f1(sc.s2)} ${esc(name2)}</span></div>
          <div class="bulk" style="margin-top:10px">

}

async function createMatch(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Registrando\u2026")) return;
  try {
  if (!matchP1 || !matchP2) { toast("Elige el jugador 1 y el jugador 2", "bad"); return; }
  if (String(matchP1) === String(matchP2)) { toast("Los dos jugadores deben ser distintos", "bad"); return; }
  const faltan = matchResults.filter(r => r === null || r === undefined).length;
  if (faltan) { toast(`Faltan ${faltan} resultado${faltan === 1 ? "" : "s"} por marcar`, "bad"); return; }
    const r = await api("match_create", {
      player1_id: Number(matchP1),
      player2_id: Number(matchP2),
      rhythm: matchRhythm,
      results: matchResults.map(Number),
      date: matchDate
    });
    dashboard = r.dashboard;
    matchResults = Array.from({length: matchGames}, () => null);
    render();
    toast("Match registrado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

/* ── Editor de match ────────────────────────────────────────────── */

function openMatchEditor(matchId) {
  const m = (dashboard.matches || []).find(x => String(x.id) === String(matchId));
  if (!m) return;
  editMatch = m;
  editMatchResults = (m.resultados || []).map(Number);
  editMatchDate = String(m.fecha || "").slice(0, 10);
  renderMatchEditor();
}

function closeMatchEditor() {
  editMatch = null;
  editMatchResults = [];
  const wrap = el("#modalWrap");
  wrap.innerHTML = "";
  wrap.classList.remove("show");
}

function renderMatchEditor() {
  const m = editMatch;
  const wrap = el("#modalWrap");
  if (!m) { closeMatchEditor(); return; }
  const prev = wrap.querySelector(".modal");
  const prevScroll = prev ? prev.scrollTop : 0;
  const p1 = (dashboard.players || []).find(p => Number(p.id) === Number(m.jugador1_id));
  const p2 = (dashboard.players || []).find(p => Number(p.id) === Number(m.jugador2_id));
  const n1 = p1 ? p1.name : "P1";
  const n2 = p2 ? p2.name : "P2";
  let s1 = 0, s2 = 0;
  const games = editMatchResults.map((r, i) => {
    const whiteIsP1 = i % 2 === 0;
    const p1wins = whiteIsP1 ? 1 : 0;
    const p2wins = whiteIsP1 ? 0 : 1;
    if (r !== null && r !== undefined) {
      if (i % 2 === 0) { s1 += r; s2 += 1 - r; } else { s2 += r; s1 += 1 - r; }
    }
    const wn = whiteIsP1 ? n1 : n2;
    const bn = whiteIsP1 ? n2 : n1;
    return `<div class="game">
      <div class="game-names">
        <div><span class="muted">P${i + 1}</span> <b>${esc(wn)}</b> <span class="muted">vs</span> <b>${esc(bn)}</b></div>
        <div class="small muted">Blancas: ${esc(wn)}</div>
      </div>
      <div class="row">
        <button class="res ${r === p1wins ? "on" : ""}" onclick="setEditMatchResult(${i},${p1wins})">Gana P1</button>
        <button class="res ${r === 0.5 ? "on" : ""}" onclick="setEditMatchResult(${i},0.5)">1/2</button>
        <button class="res ${r === p2wins ? "on" : ""}" onclick="setEditMatchResult(${i},${p2wins})">Gana P2</button>
      </div>
    </div>`;
  }).join("");
  wrap.innerHTML = `
    <div class="modal-back" id="modalBack" onclick="if(event.target.id==='modalBack')closeMatchEditor()">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editMatchTitle">
        <h3 id="editMatchTitle">Editar match</h3>
        <div class="modal-body">
          <div><b>${esc(n1)}</b> <span class="muted">vs</span> <b>${esc(n2)}</b> · ${esc(m.ritmo)} · ${editMatchResults.length} partidas</div>
          <div style="margin-top:10px"><label>Fecha del match</label>
            <input class="input" type="date" id="editMatchDate" value="${esc(editMatchDate)}" max="${todayLocal()}" onchange="editMatchDate=this.value"></div>
          <div class="bulk" style="margin-top:12px">
            <button class="btn btn-sm" onclick="bulkEditMatch('p1')">Gana P1 todas</button>
            <button class="btn btn-sm" onclick="bulkEditMatch('draw')">Todas 1/2</button>
            <button class="btn btn-sm" onclick="bulkEditMatch('p2')">Gana P2 todas</button>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="btn btn-sm btn-ghost" onclick="resizeMatch(-1)" ${editMatchResults.length <= 1 ? "disabled" : ""}>${ic("minus")}Quitar partida</button>
            <button class="btn btn-sm btn-ghost" onclick="resizeMatch(1)" ${editMatchResults.length >= 999 ? "disabled" : ""}>${ic("plus")}Añadir partida</button>
            <span class="small muted">${editMatchResults.length} partida(s) · las blancas se alternan</span>
          </div>
          <div style="margin-top:6px">${games}</div>
          <div class="small muted" style="margin-top:10px">Marcador: <b>${f1(s1)} - ${f1(s2)}</b>. Al guardar se recalculan los ratings y los matches posteriores de estos jugadores.</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeMatchEditor()">Cancelar</button>
          <button class="btn btn-primary" onclick="saveMatchEdit()">${ic("check")}Guardar cambios</button>
        </div>
      </div>
    </div>`;
  wrap.classList.add("show");
  const box = wrap.querySelector(".modal");
  if (box) box.scrollTop = prevScroll;
}

function setEditMatchResult(i, v) {
  editMatchResults[i] = v;
  renderMatchEditor();
}

function bulkEditMatch(mode) {
  for (let i = 0; i < editMatchResults.length; i++) {
    const whiteIsP1 = i % 2 === 0;
    if (mode === "p1") editMatchResults[i] = whiteIsP1 ? 1 : 0;
    else if (mode === "p2") editMatchResults[i] = whiteIsP1 ? 0 : 1;
    else editMatchResults[i] = 0.5;
  }
  renderMatchEditor();
}

function resizeMatch(delta) {
  const n = editMatchResults.length + delta;
  if (n < 1 || n > 999) return;
  if (delta > 0) editMatchResults.push(1);
  else editMatchResults.pop();
  renderMatchEditor();
}

async function saveMatchEdit() {
  const m = editMatch;
  if (!m) return;
  const faltan = editMatchResults.filter(r => r === null || r === undefined).length;
  if (faltan) return toast(`Faltan ${faltan} resultados por marcar`, "bad");
  try {
    const r = await api("match_update", {
      match_id: m.id,
      results: editMatchResults.map(Number),
      date: editMatchDate
    });
    dashboard = r.dashboard;
    closeMatchEditor();
    render();
    toast("Match corregido", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
}

async function deleteMatch(matchId) {
  const m = (dashboard.matches || []).find(x => String(x.id) === String(matchId));
  if (!m) return;
  const ok = await uiModal({
    title: "Eliminar match",
    body: `Se eliminará el match <b>${esc(m.p1)} - ${esc(m.p2)}</b> (${m.np} partidas, ${esc(m.fecha ? String(m.fecha).slice(0, 10) : "")})`
        + " y se recalcularán los ratings de esos jugadores.",
    okText: "Eliminar", okClass: "btn-danger", danger: true
  });
  if (!ok) return;
  try {
    const r = await api("match_delete", {match_id: Number(matchId)});
    dashboard = r.dashboard;
    render();
    toast("Match eliminado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
}

/* ── Impresión / PDF de la clasificación ────────────────────────── */

function printHtml(t) {
  // Solo se imprimen los desempates que aplican a este tipo de torneo.
  const crit = criteriosDe(t);
  const filas = (t.standings || []).map(s => `<tr>
    <td>${s.pos}</td><td>${esc(s.name)}${s.withdrawn ? " (retirado)" : ""}</td>
    ${crit.map(c => `<td class="num">${valorCriterio(s, c.key)}</td>`).join("")}
    <td class="num">${s.rating}</td><td class="num">${fv(s.v)}</td>
    <td class="num">${s.tpr}</td></tr>`).join("");
  const byRound = {};
  (t.games || []).forEach(g => { (byRound[g.round] = byRound[g.round] || []).push(g); });
  const partidas = Object.keys(byRound).sort((a, b) => a - b).map(r =>
    `<tr><td>Ronda ${r}</td><td>${esc(byRound[r].map(g => g.white || "").join(", "))}</td>`
    + `<td>${esc(byRound[r].map(g => g.black || "").join(", "))}</td>`
    + `<td>${esc(byRound[r].map(g => g.result === 1 ? "1-0" : (g.result === 0 ? "0-1" : (g.result === 0.5 ? "1/2" : "-"))).join(", "))}</td></tr>`
  ).join("");
  return `<h1>${esc(t.name)}</h1>
    <div class="pmeta">${esc(t.rhythm)} · ${esc(TYPE_NAMES[t.type] || "Torneo")} · Ronda ${t.round_current}/${t.rounds_total}`
    + (t.date_start ? ` · ${esc(String(t.date_start).slice(0, 10))}` : "") + "</div>"
    + `<h2>Clasificación</h2>
    <table><thead><tr><th>#</th><th>Jugador</th>${crit.map(c => `<th class="num">${esc(c.label)}</th>`).join("")}
      <th class="num">Rtg</th><th class="num">V</th><th class="num">Rend. est.</th>
    </tr></thead><tbody>${filas}</tbody></table>
    ${partidas ? `<h2>Partidas</h2><table><thead><tr><th>Ronda</th><th>Blancas</th><th>Negras</th><th>Resultado</th></tr></thead><tbody>${partidas}</tbody></table>` : ""}`;
}

function printTournament(t) {
  if (!t) return;
  el("#printArea").innerHTML = printHtml(t);
  window.print();
}

async function printTournamentById(id) {
  let t = null;
  if (dashboard && dashboard.current && Number(dashboard.current.id) === Number(id)) t = dashboard.current;
  else if (historyTournament && Number(historyTournament.id) === Number(id)) t = historyTournament;
  if (!t) {
    try {
      const r = await api("tournament_get", { tournament_id: id });
      t = r.tournament;
    } catch (e) { toast(cleanMessage(e), "bad"); return; }
  }
  printTournament(t);
}

function openDraft(id) {
  draftsSel = id;
  draftAdd = {playerId: "", name: "", cat: "-", mun: "Falcón"};
  render(false);
  scrollToTop();
}

async function createDraft(ev) {
  const btn = ev && ev.currentTarget;
  const name = (draftNew.name || "").trim();
  if (!name) { setInlineMsg("#dMsg", "Pon un nombre al pre-registro"); return; }
  setInlineMsg("#dMsg", "");
  if (!beginBusy(btn, "Creando…")) return;
  try {
    const r = await api("draft_create", {
      name,
      type: Number(draftNew.type),
      rhythm: draftNew.rhythm,
      rounds_total: draftNew.type === 1 ? (draftNew.rounds || null) : null,
      date_start: draftNew.date
    });
    dashboard = r.dashboard;
    draftsSel = r.draft_id || null;
    draftNew = {name: "", type: 1, rhythm: "Blitz", date: "", rounds: ""};
    render(false);
    toast("Pre-registro creado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

async function addDraftEntry(draftId, ev) {
  const btn = ev && ev.currentTarget;
  const payload = {draft_id: Number(draftId)};
  if (draftAdd.playerId) {
    payload.player_id = Number(draftAdd.playerId);
  } else {
    const nm = (draftAdd.name || "").trim();
    if (!nm) { toast("Escribe el nombre del inscrito", "bad"); return; }
    payload.name = nm;
    payload.cat = draftAdd.cat;
    payload.mun = draftAdd.mun;
  }
  if (!beginBusy(btn, "Agregando…")) return;
  try {
    const r = await api("draft_entry_add", payload);
    dashboard = r.dashboard;
    draftAdd = {playerId: "", name: "", cat: "-", mun: "Falcón"};
    render();
    toast("Inscrito agregado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

async function removeDraftEntry(draftId, entryId, ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "…")) return;
  try {
    const r = await api("draft_entry_remove", {draft_id: Number(draftId), entry_id: Number(entryId)});
    dashboard = r.dashboard;
    render();
  } catch (e) { toast(cleanMessage(e), "bad"); }
  finally { endBusy(btn); }
}

async function activateDraft(draftId) {
  const d = (dashboard.drafts || []).find(x => Number(x.id) === Number(draftId));
  if (!d) return;
  const nuevos = d.entries.filter(e => !e.exists).length;
  const ok = await uiModal({
    title: "Activar torneo",
    body: `Se creará el torneo <b>${esc(d.name)}</b> con <b>${d.entries.length} inscriptos</b>.`
        + (nuevos ? ` Se darán de alta <b>${nuevos}</b> jugador${nuevos === 1 ? "" : "es"} nuevo${nuevos === 1 ? "" : "s"}.` : "")
        + " Después podrás emparejar la primera ronda.",

  });

  try {
    const r = await api("draft_activate", {draft_id: Number(draftId)});
    dashboard = r.dashboard;
    draftsSel = null;
    tab = "torneo";
    render(false);
    toast("Torneo activado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
}

async function deleteDraft(draftId, ev) {
  const d = (dashboard.drafts || []).find(x => Number(x.id) === Number(draftId));
  if (!d) return;
  const ok = await uiModal({
    title: "Eliminar pre-registro",
    body: `Se borrará la lista de <b>${esc(d.name)}</b> (${d.entries.length} inscriptos). Los jugadores ya existentes no se tocan.`,

  try {
    const r = await api("draft_delete", {draft_id: Number(draftId)});

    render(false);

}

          <div style="flex:1;min-width:110px"><label>Rating</label>
            <input class="input" id="pRating" type="number" min="600" max="4000" value="${esc(playerForm.rating)}" oninput="playerForm.rating=this.value; playerForm.dirty=true">

        <thead><tr><th>Nombre</th><th>Cat</th><th>Municipio</th><th class="num">Rapid</th><th class="num">Blitz</th><th class="num">Bullet</th><th class="num" title="Partidas jugadas en total">Part.</th><th></th></tr></thead>
        <tbody id="playerTable">${rows}</tbody>
      </table></div>
      <div class="empty hidden" id="playerTableEmpty">${IC_EMPTY}<span>Sin jugadores con ese filtro.</span></div>

function filterPlayerTable(q) {
  q = String(q || "").toLowerCase();
  let visibles = 0;
  document.querySelectorAll("#playerTable tr").forEach(row => {
    const name = (row.getAttribute("data-name") || "").toLowerCase();
    const hide = !!(q && !name.includes(q));
    row.classList.toggle("hidden", hide);
    if (!hide) visibles++;
  });
  const vacio = el("#playerTableEmpty");
  if (vacio) vacio.classList.toggle("hidden", visibles > 0);
}

function startEditPlayer(id) {
  editingPlayer = (dashboard.players || []).find(p => Number(p.id) === Number(id)) || null;
  if (editingPlayer) {
    const per = editingPlayer.partidas || {};
    const ritmo = RHYTHMS.slice().sort((a, b) => (per[b] || 0) - (per[a] || 0))[0] || "Blitz";
    const slot = (editingPlayer.ratings || {})[ritmo] || {};
    playerForm = {
      name: editingPlayer.name || "",
      mun: editingPlayer.mun || "Falcón",
      cat: editingPlayer.cat || "-",
      foto: editingPlayer.foto_url || "",
      rhythm: ritmo,
      rating: String(round(slot.rating || 1500)),
      rd: String(Math.round((slot.rd || 500) * 10) / 10),
      dirty: false,
    };
  }
  render();
  scrollToTop();
}
function cancelEditPlayer() {
  editingPlayer = null;
  playerForm = {name:"", mun:"Falcón", cat:"-", foto:"", rhythm:"Blitz", rating:"", rd:"", dirty:false};
  render();
}

/* ── Foto del jugador: subida a Supabase Storage ─────────────────── */

function pickPlayerPhoto() {
  const input = el("#pFotoFile");
  if (input) input.click();
}

function photoPreviewHtml(src) {
  if (src) {
    return `<img src="${esc(src)}" alt="" onerror="this.style.display='none'">`;
  }
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L7 20"/></svg>`;
}

function refreshPhotoPreview() {
  const box = el("#pFotoPrev");
  if (box) box.innerHTML = photoPreviewHtml(playerForm.foto || pendingPhotoUrl || "");
}

function setPlayerPhotoUrl(v) {
  playerForm.foto = v;
  refreshPhotoPreview();
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error("No se pudo leer la imagen"));
    fr.readAsDataURL(blob);
  });
}

function downscaleImage(file, maxSide) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        if (!side) throw new Error("Imagen vacía");
        const out = Math.min(maxSide || 512, side);
        const cv = document.createElement("canvas");
        cv.width = out; cv.height = out;
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0, 0, out, out);
        ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
        cv.toBlob(b => b ? resolve(b) : reject(new Error("No se pudo procesar la imagen")), "image/jpeg", 0.85);
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Esa imagen no se pudo abrir")); };
    img.src = url;
  });
}

async function uploadPlayerPhoto(input) {
  const file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast("Elige un archivo de imagen", "bad"); return; }
  if (file.size > 12 * 1024 * 1024) { toast("La imagen es muy pesada (máx. 12 MB)", "bad"); return; }
  const btn = el("#pFotoUploadBtn");
  try {
    const blob = await downscaleImage(file, 512);
    if (editingPlayer) {
      if (!beginBusy(btn, "Subiendo…")) return;
      try {
        const data = await blobToDataUrl(blob);
        const r = await api("photo_upload", { player_id: editingPlayer.id, data });
        dashboard = r.dashboard;
        playerForm.foto = r.url || playerForm.foto;
        const saved = (dashboard.players || []).find(p => Number(p.id) === Number(editingPlayer.id));
        if (saved) editingPlayer = saved;
        render();
        toast("Foto actualizada", "good");
      } finally { endBusy(btn); }
    } else {
      if (pendingPhotoUrl) URL.revokeObjectURL(pendingPhotoUrl);
      pendingPhoto = blob;
      pendingPhotoUrl = URL.createObjectURL(blob);
      refreshPhotoPreview();
      toast("Foto lista: se subirá al guardar el jugador", "info");
    }
  } catch (e) {
    toast(cleanMessage(e), "bad");
  }
}

async function clearPlayerPhoto() {
  const hadServerPhoto = !!(editingPlayer && editingPlayer.foto_url);
  if (pendingPhotoUrl) { URL.revokeObjectURL(pendingPhotoUrl); pendingPhotoUrl = null; }
  pendingPhoto = null;
  playerForm.foto = "";
  refreshPhotoPreview();
  if (hadServerPhoto) {
    try {
      const r = await api("photo_delete", { player_id: editingPlayer.id });
      dashboard = r.dashboard;
      const saved = (dashboard.players || []).find(p => Number(p.id) === Number(editingPlayer.id));
      if (saved) editingPlayer = saved;
      render();
      toast("Foto quitada", "good");
    } catch (e) { toast(cleanMessage(e), "bad"); }
  }
}

function setPlayerRhythm(v) {
  playerForm.rhythm = v;
  if (editingPlayer && v !== "Todos") {
    const slot = (editingPlayer.ratings || {})[v] || {};
    playerForm.rating = String(round(slot.rating || 1500));
    playerForm.rd = String(Math.round((slot.rd || 500) * 10) / 10);
    playerForm.dirty = false;
  } else if (editingPlayer && v === "Todos") {
    playerForm.dirty = true;
  }
  render();
}

async function savePlayer(ev) {
  const btn = ev && ev.currentTarget;
  if (!beginBusy(btn, "Guardando\u2026")) return;
  try {
  const name = playerForm.name.trim();
  const mun = playerForm.mun.trim() || "Falcón";
  const cat = playerForm.cat || "-";
  const foto_url = playerForm.foto.trim();
  if (!name) { setInlineMsg("#pMsg", "El nombre es obligatorio"); toast("El nombre es obligatorio", "bad"); return; }
  setInlineMsg("#pMsg", "");
  try {
    const payload = {name, mun, cat, foto_url};
    const ratingRaw = (playerForm.rating || "").trim();
    const rdRaw = (playerForm.rd || "").trim();
    const aplica = editingPlayer ? playerForm.dirty : (ratingRaw || rdRaw);
    if (aplica && (ratingRaw || rdRaw)) {
      payload.rhythm = playerForm.rhythm;
      if (ratingRaw) payload.rating = Number(ratingRaw);
      if (rdRaw) payload.rd = Number(rdRaw);
    }
    const prevPhoto = editingPlayer ? editingPlayer.foto_url : "";
    if (editingPlayer && prevPhoto && !foto_url) {
      try { dashboard = (await api("photo_delete", { player_id: editingPlayer.id })).dashboard; } catch (e) {}
    }
    let r;
    if (editingPlayer) r = await api("player_update", Object.assign({player_id: editingPlayer.id}, payload));
    else r = await api("player_create", payload);
    dashboard = r.dashboard;
    const savedId = r.player ? r.player.id : (editingPlayer ? editingPlayer.id : null);
    if (pendingPhoto && savedId) {
      try {
        const up = await api("photo_upload", { player_id: savedId, data: await blobToDataUrl(pendingPhoto) });
        dashboard = up.dashboard;
      } catch (e) {
        toast("Jugador guardado, pero la foto no se subió: " + cleanMessage(e), "bad");
      }
      pendingPhoto = null;
      if (pendingPhotoUrl) { URL.revokeObjectURL(pendingPhotoUrl); pendingPhotoUrl = null; }
    }
    editingPlayer = null;
    playerForm = {name:"", mun:"Falcón", cat:"-", foto:"", rhythm:"Blitz", rating:"", rd:"", dirty:false};
    render();
    toast("Jugador guardado", "good");
  } catch (e) { toast(cleanMessage(e), "bad"); }
  }
  finally { endBusy(btn); }
}

        <div class="small muted">${esc(t.rhythm)} · ${esc(TYPE_NAMES[t.type] || "Torneo")} · ${t.rounds_total} rondas · ${t.date_start ? esc(String(t.date_start).slice(0,10)) : ""}</div>

}
